        account: Ajuste da conta bancária
        amount: Ajuste do valor
        auto_tune: Ajuste automático
        category_training: Ajuste do classificador de categorias
        clear_locks: Remover os bloqueios da Bayes
        clear_locks_confirm_body: Desbloqueia as categorias Bayes bloqueadas e os estabelecimentos bloqueados pelo classificador que ainda correspondem às configurações definidas, permitindo que as regras e AI as modifiquem novamente. As categorias e os estabelecimentos permanecem inalterados.
        clear_locks_confirm_button: Limpar bloqueios
        clear_locks_confirm_title: Limpar os bloqueios da Bayes?
        description: O classificador de categorias Bayes aprende com suas transações já categorizadas e as classifica automaticamente antes de qualquer provedor AI. As alterações nessas configurações entram em vigor na próxima execução da classificação; as transações já categorizadas mantêm suas categorias.
        matcher: Classificador
        matcher_description: Preenche os estabelecimentos faltantes a partir de transações quase idênticas, conforme a regra do classificador de estabelecimentos (após cada sincronização) e durante as execuções. Isso altera os estabelecimentos armazenados.
        matcher_tuning: Ajuste do correspondente de estabelecimentos
        merchant: Ajuste de estabelecimentos
        run: Executar
        scoring: Classificação
        title: Classificador
        training: Treinamento
        words: Ajuste de transações
      training:
        max_training_transactions: Treinamento de transações
        max_training_transactions_hint: 'Quantas das transações mais recentes usar (100–20,000): as categorizadas, das quais o classificador aprende, e aquelas com um estabelecimento, das quais o comparador copia.'
      words:
        bigrams: Incluir pares de palavras
        bigrams_hint: Palavras vizinhas também são consideradas juntas, como em "pagamento com cartão".
        binary: Excluir palavras repetidas
        binary_hint: Cada palavra é contada uma única vez por transação.
        drop_codes: Exclua códigos de referência
        drop_codes_hint: Palavras que misturem letras com 2 ou mais dígitos, como 2k4l19.
        drop_numbers: Exclua números
        drop_numbers_hint: Armazene números, datas e valores na descrição.
        include_notes: Inclua notas
        include_notes_hint: Lê as anotações, bem como o nome.
        keep_single_chars: Incluir palavras de um único caractere
        keep_single_chars_hint: Letras e dígitos que restam após a divisão, como o "s" de mcdonald's.
        spread_filter: Excluir palavras utilizadas por todas as categorias da mesma forma
        spread_filter_hint: Eles não fornecem informações sobre a categoria. O número indica o quanto o uso de uma categoria deve ser maior que a média geral.
        word_split: As palavras são formadas por
        word_split_ascii: de a–z e 0–9
        word_split_hint: Todos os outros caracteres separam as palavras. Letras de qualquer escrita mantêm palavras como Geschäft ou Кофейня intactas; letras ligadas por um único símbolo interno também permanecem como uma palavra, como mcdonald's, s/o e m&s (um símbolo em qualquer uma das extremidades, como em *netflix, continua sendo removido).
        word_split_symbols: Letras, dígitos e símbolos internos
        word_split_unicode: Letras e dígitos, de qualquer escrita
