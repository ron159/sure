    system_health:
      optional_services:
        title: Serviços opcionais
        description: Integrações de operadores opcionais. Os serviços não configurados têm apenas finalidade informativa. Essas verificações analisam apenas as configurações; elas não testam a conectividade, nem enviam eventos de teste, nem alteram o consentimento para análises. Expanda um serviço para conhecer os detalhes de configuração.
        missing_settings: 'Configurações faltando: %{settings}'
        statuses:
          incomplete: Configuração incompleta
          disabled: Desativado neste processo
        notes:
          environment_disabled: A integração carregada está desativada para este ambiente Rails.
          explicitly_disabled: O SKYLIGHT_ENABLED desativa explicitamente a instrumentação.
          self_hosted_checkout_disabled: O checkout de assinaturas e o portal de faturamento estão desativados no modo autogerenciado. Os webhooks Stripe ainda podem ser configurados; aqui, os IDs de preço do checkout não são necessários.
          browser_analytics_disabled: As análises do navegador estão desativadas para este ambiente. Isso não desativa o cliente do servidor configurado separadamente.
          shared_feedback_configured: O sistema de feedback autogerenciado possui um projeto embutido separado e é ativado por meio de sua configuração. Ele não requer um operador POSTHOG_KEY. A opção de exclusão pelo navegador e a disponibilidade do SDK não são verificadas.
          shared_feedback_disabled: O projeto separado de feedback autogerenciado é desativado por meio de sua configuração de feedback ou do ambiente. Isso não desativa as análises pertencentes ao operador.
          production_only: Esta integração é utilizada apenas em produção, de acordo com a configuração atual do aplicativo.
        services:
          langfuse:
            title: Langfuse
            description: Relatórios opcionais de rastreamento e avaliação AI. Nenhuma solicitação de rastreamento ou avaliação é enviada por esta verificação.
            guidance: Defina o LANGFUSE_PUBLIC_KEY e o LANGFUSE_SECRET_KEY juntos. O LANGFUSE_HOST é opcional. Reinicie os serviços afetados após alterar essas configurações.
          sentry:
            title: Sentry
            description: Relatórios opcionais de erros e desempenho. O inicializador atual permite a geração de relatórios apenas em ambiente de produção.
            guidance: Defina o SENTRY_DSN e reinicie os serviços afetados. Essa ação verifica a configuração do SDK carregada, sem gerar erro ou enviar nenhum evento.
          skylight:
            title: Skylight
            description: Instrumentação opcional de desempenho do aplicativo. A presença da configuração não garante que o agente esteja em execução ou gerando relatórios.
            guidance: Defina o SKYLIGHT_AUTHENTICATION e confira se o Skylight está carregado no ambiente Rails desejado. O valor SKYLIGHT_ENABLED=false desativa a instrumentação; por si só, esse parâmetro não carrega o módulo necessário. Reinicie após as alterações.
          stripe:
            title: Stripe
            description: Webhooks opcionais para cobrança de assinaturas e pagamentos. Essa verificação não cria um cliente Stripe, nem valida credenciais, nem envia solicitações de pagamento.
            guidance: Defina STRIPE_SECRET_KEY e STRIPE_WEBHOOK_SECRET juntos. O processo de finalização de assinaturas gerenciadas também requer STRIPE_MONTHLY_PRICE_ID e STRIPE_ANNUAL_PRICE_ID.
          posthog:
            title: PostHog
            description: Análises opcionais de propriedade do operador, utilizando a configuração carregada na inicialização. O fato de estar configurado não significa que o usuário concordou com as análises.
            guidance: Defina POSTHOG_KEY e um valor não vazio para POSTHOG_HOST, ou deixe o campo do host sem valor para usar o padrão. As análises do navegador exigem o ambiente de produção ou POSTHOG_DEVELOPMENT_ENABLED no ambiente de desenvolvimento. POSTHOG_FEEDBACK_ENABLED controla o feedback autogerenciado separado, e não as análises do operador.
          logtail:
            title: Logtail
            description: Encaminhamento opcional de logs para produção. Quando não está configurado, o aplicativo continua registrando os dados na saída padrão.
            guidance: Defina LOGTAIL_API_KEY e LOGTAIL_INGESTING_HOST juntos e reinicie os serviços afetados. Nenhum log de teste é gerado por esta verificação.
      configuration:
        description: Configuração visível para este processo da web. Estas verificações não enviam e-mails, entram em contato com provedores, nem fazem upload ou download de arquivos. O fato de estar configurado significa que as configurações existem, mas não que o envio, o acesso aos provedores ou o acesso ao armazenamento foram verificados.
