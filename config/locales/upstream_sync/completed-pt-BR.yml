        threshold: Limite
        threshold_hint: A pontuação mínima exigida pelo Bayes para classificar uma transação (0.05–0.99). Limites mais baixos permitem a classificação de mais transações, mas também geram mais erros.
      clear_locks:
        success: Os bloqueios de Bayes estão sendo apagados. Isso pode levar alguns instantes.
      evaluation:
        apply_best: Aplicar estas configurações
        best: Melhor encontrado
        best_changes: 'Melhor encontrado, alterado do seu:'
        best_no_changes: Nada obteve melhor pontuação do que suas configurações.
        buttons_hint: 'Testar minhas configurações pontua suas configurações. Encontrar as melhores configurações pesquisa o %{tuning} meses antes daqueles mostrados, então o que ele encontra é pontuado nos meses que não viu. Ele avalia pelo ROC-AUC: quão bem as pontuações classificam as transações de cada categoria acima das demais, em qualquer limite, mantendo uma alteração apenas quando for mais alta no geral e apenas em todos os meses %{tuning}, exceto um. Ele primeiro escolhe as entradas (cada combinação de token do comerciante, valor e conta; em seguida, classifica o comerciante e a conta separadamente; depois o nome do comerciante e as notas como palavras), depois tenta uma alteração de cada vez nas outras configurações e, por último, na Pontuação. Os padrões são os do classificador original, com categorias de sua escolha; Redefinir para os padrões alterna para eles e os testa.'
        categories_heading: Classificador de categoria
        change: "%{setting}: %{value}"
        confusion: "%{actual} → %{predicted}"
        confusions: 'Erros mais comuns: %{column} em %{threshold}'
        current: Minhas configurações
        defaults: Padrões
        description: Cada coluna é pontuada nos últimos %{months} meses como novas transações, cada mês treinado no histórico anterior e depois comparado com suas categorias. O teste não altera a categoria da transação e as configurações do classificador mudam apenas quando você aplica ou reinicia.
        find_best: Encontre as melhores configurações
        matcher_confusions: 'Erros de comerciante mais comuns: %{column} em %{similarity}'
        matcher_description: 'Comerciantes que o correspondente preenche nos mesmos meses %{months}: %{count} transações com um comerciante, cada uma comparada com o histórico anterior ao mês com seu comerciante oculto; certo é o comerciante que tem. Cada ponto de corte e número de comerciantes são pontuados; O melhor encontrado é aquele com a melhor célula pelo custo de um erro, que o Apply define. O teste não preenche nenhum comerciante.'
        merchants_heading: Correspondente de comerciante
        no_confusions: Nenhum erro neste limite.
        no_matcher_confusions: Nenhum comerciante comete erros com essa semelhança.
        no_uncategorized: Nada ficou sem categoria neste limite.
        no_unfilled: Nada fica sem um comerciante com essa semelhança.
