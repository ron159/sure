        checks:
          smtp:
            title: E-mail (SMTP)
            statuses:
              configured: As configurações do SMTP estão presentes.
              not_configured: O SMTP não está configurado. Redefinições de senha, convites e outros e-mails do sistema não podem ser enviados por meio do SMTP.
              incomplete: Algumas configurações de e-mail estão faltando ou incompletas. Os e-mails do sistema ou os links neles contidos podem não funcionar.
              disabled: A entrega de e-mails está desativada na configuração atual do serviço de e-mail.
              not_checked: Este processo utiliza um método de entrega diferente de SMTP, como uma versão de pré-visualização para desenvolvedores. A entrega por SMTP não é avaliada.
            guidance: SMTP não pode ser configurado na interface de administrador. Defina as variáveis de ambiente de e-mail tanto para os serviços web quanto para os workers e, em seguida, reinicie ambos. SMTP_USERNAME e SMTP_PASSWORD podem ser omitidos em um relay não autenticado.
            issues:
              address: SMTP_ADDRESS
              port: SMTP_PORT (um número de 1 a 65535)
              sender: EMAIL_SENDER (substitui o valor padrão sender@sure.local)
              app_domain: APP_DOMAIN (usado em links de e-mail)
              authentication: SMTP_USERNAME e SMTP_PASSWORD (forneça ambos ou nenhum)
          securities:
            title: Preços de mercado
            statuses:
              configured: Todos os fornecedores de preços de mercado habilitados possuem configuração.
              not_configured: Os fornecedores de preços de mercado habilitados estão sem as chaves API. As buscas automáticas por ativos financeiros e as consultas de preços não estão disponíveis por meio desses fornecedores.
              incomplete: Pelo menos um fornecedor de preços de mercado habilitado possui configuração faltando ou uma seleção inválida. Os ativos financeiros atribuídos a esse fornecedor podem não receber atualizações de preço.
              disabled: Nenhum fornecedor de preços de mercado está habilitado. As buscas automáticas por ativos financeiros e as consultas de preços não estão disponíveis.
            guidance: Escolha os provedores e adicione as chaves API necessárias nas configurações de autohosting, ou configure-os no ambiente de implantação. As configurações definidas no ambiente têm prioridade. Os provedores públicos não precisam de uma chave API.
          exchange_rates:
            title: Taxas de câmbio
            statuses:
              configured: O provedor de taxa de câmbio selecionado possui configurações definidas.
              not_configured: Nenhum provedor de taxa de câmbio útil foi configurado. A conversão automática de moeda pode não estar disponível quando uma taxa armazenada estiver faltando.
            guidance: Escolha um provedor de taxa de câmbio e adicione sua chave API, se necessário, nas configurações de autohosting, ou configure-o no ambiente de implantação. As configurações EXCHANGE_RATE_PROVIDER e a chave API do provedor, definidas no ambiente, têm prioridade.
            issues:
              invalid_provider: O provedor de taxa de câmbio selecionado não foi reconhecido. As consultas automáticas de taxas falham até que um provedor suportado seja selecionado.
          storage:
            title: Carregamento e armazenamento de arquivos
            statuses:
              configured: As configurações de armazenamento estão disponíveis; o disco local não requer credenciais de nuvem.
              not_configured: O backend de armazenamento selecionado não possui configuração correspondente. O carregamento de arquivos pode ficar indisponível.
              incomplete: As configurações de armazenamento necessárias estão faltando ou incompletas. O carregamento ou a recuperação de arquivos podem não funcionar.
              not_checked: Esse backend utiliza descoberta de credenciais externas ou uma configuração personalizada. Seu acesso não pode ser determinado apenas com base nessas configurações.
            guidance: Revise ACTIVE_STORAGE_SERVICE e as configurações de implantação do backend selecionado. O disco local precisa de armazenamento persistente compartilhado pelos serviços da web e dos workers. Trocar de backend não migra arquivos existentes; planeje qualquer migração separadamente.
