        weight_hint: 'Seleciona o que foi definido em Apply: as células em negrito, onde a diferença entre as respostas corretas e esses valores por erro é a maior. É o limite ideal para as categorias; o ponto de corte, a semelhança e o número de estabelecimentos para o mecanismo de correspondência.'
        weight_option:
          one: Resposta correta para 1
          other: "%{count} respostas corretas"
      matcher:
        lock_similar_merchants: Bloqueia os estabelecimentos definidos pelo ajustador
        lock_similar_merchants_hint: Interrompe as regras, AI, e sincroniza as alterações nelas, a menos que você clique em Aplicar em uma regra. Os bloqueios próprios não são considerados confirmados (Ajuste do ajustador de estabelecimentos).
        rule: Preenche os estabelecimentos faltantes a partir de duplicatas próximas
        rule_hint: A regra do ajustador de estabelecimentos, ativada ou desativada nas Regras. Na ordem das suas regras, uma transação sem estabelecimento recebe o do seu correspondente mais próximo, como "NETFLIX.COM 8812" e "Netflix com", que todos possuem. As transferências são excluídas.
        similar_threshold: Semelhança
        similar_threshold_hint: Menor semelhança entre as descrições, ignorando números e códigos de referência (0.5–0.99). Quanto menor o valor, mais erros aparecem. As configurações de Aplicar do Auto-tune também influenciam isso.
      matcher_tuning:
        similar_common_share: Data de corte
        similar_common_share_hint: Uma palavra ou sequência de 3 letras presente em mais que esta proporção das transações de origem (0,01–1) e em pelo menos 50 delas é comum demais para distingui-las, como «cartão» ou «pagamento», e por isso é ignorada. Um valor maior inclui mais palavras. O botão Aplicar do ajuste automático também define esse valor.
        similar_min_neighbours: Estabelecimentos concordando
        similar_min_neighbours_hint: Quantos quase-duplos devem existir para o estabelecimento, sem que nenhum outro exista. 1 copia uma única transação, o que também é um erro.
        similar_min_neighbours_option:
          one: 1 estabelecimento
          other: "%{count} estabelecimentos"
        similar_skip_self: Não copie os estabelecimentos do próprio identificador até que seja confirmado ou tenham passado estes dias
        similar_skip_self_hint: Confirmado significa que você o alterou ou bloqueou. Uma cópia incorreta não é disseminada; uma deixada sem alterações por tanto tempo é considerada aceita.
