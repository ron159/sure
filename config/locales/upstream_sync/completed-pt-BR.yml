        complement_hint: Avalia cada categoria de acordo com o quão mal a transação se encaixa nas demais, o que ajuda a lidar melhor com categorias de tamanhos muito diferentes. O modo 'Desativado' segue o método multinomial original.
        prior: Inclua a frequência com que cada categoria é utilizada
        prior_hint: Dá preferência às categorias que você usa com mais frequência. O modo 'Desativado' trata todas as categorias da mesma forma, assim como no original.
        separate_fields: Avalie o estabelecimento e a conta bancária separadamente, excluindo as palavras.
        separate_fields_hint: Cada um recebe sua própria avaliação, portanto uma descrição longa não tem mais peso do que os outros. É necessário incluir o estabelecimento ou a conta bancária; o valor é sempre avaliado individualmente.
        smoothing: Suavização
        smoothing_hint: É adicionado a cada contagem para que uma palavra não vista anteriormente não exclua uma categoria (0.001–10). 1 corresponde ao método original; o valor mais baixo dá mais peso ao que já foi visto.
