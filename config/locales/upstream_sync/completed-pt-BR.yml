        merchant_name_words: Inclua o nome do estabelecimento como palavras
        merchant_name_words_hint: Leia da mesma forma que a descrição, assim como no original, para que nomes semelhantes compartilhem evidências. Há sobreposição com o token abaixo.
      run:
        success: Bayes está categorizando transações não classificadas. Isso pode levar alguns instantes.
      scoring:
