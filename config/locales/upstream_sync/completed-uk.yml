            guidance: З'єднайте LANGFUSE_PUBLIC_KEY і LANGFUSE_SECRET_KEY. LANGFUSE_HOST не обов'язковий. Після зміни цих параметрів перезапустіть служби, на які вони впливають.
          sentry:
            title: Sentry
            description: Необов'язкові звіти про помилки та швидкодію. Поточний ініціалізатор уможливлює звітування лише у виробничому режимі.
            guidance: Встановити SENTRY_DSN і перезапустити служби, яких це стосується. За допомогою цього пункту можна перевірити завантажене налаштування SDK без запису помилки або надсилання події.
          skylight:
            title: Skylight
            description: Додаткові інструменти для вимірювання продуктивності програм. Наявність налаштувань не підтверджує, що агент запущено або що він повідомляє.
            guidance: Встановіть SKYLIGHT_AUTHENTICATION і переконайтеся, що Skylight завантажено у призначеному середовищі Rails. SKYLIGHT_ENABLED=false вимикає інструменти; сам по собі прапорець не завантажує gem. Перезапустити після змін.
          stripe:
            title: Stripe
            description: Необов’язкові webhooks для розрахунків за підписку та платежі. Ця перевірка не створює клієнта Stripe, не перевіряє дані реєстрації або не надсилає запитів на оплату.
            guidance: З'єднайте STRIPE_SECRET_KEY і STRIPE_WEBHOOK_SECRET. Управління підпискою також потребує STRIPE_MONTHLY_PRICE_ID і STRIPE_ANNUAL_PRICE_ID.
          posthog:
            title: PostHog
            description: Необов'язковий аналіз, що належить оператору, з використанням налаштувань, завантажених під час завантаження. Налаштовано не означає, що користувач погодився на аналіз.
            guidance: Встановіть POSTHOG_KEY і не порожній POSTHOG_HOST або залиште вузол незмінним, щоб використовувати типовий. Аналітика браузера вимагає виробництва або POSTHOG_DEVELOPMENT_ENABLED у розробці. POSTHOG_FEEDBACK_ENABLED керує окремим самостійним зворотнім зв'язком, а не аналітикою оператора.
          logtail:
            title: Logtail
            description: Необов'язкове пересилання журналу виробництва. Якщо цей параметр не налаштовано, програма продовжуватиме записувати дані журналу у стандартний вивід.
            guidance: Встановити LOGTAIL_API_KEY і LOGTAIL_INGESTING_HOST разом і перезапустити служби, яких це стосується. Під час цієї перевірки не буде випущено журналу перевірки.
      configuration:
        description: Налаштування, видимі для цього веб- процесу. Ці перевірки не надсилають листів електронної пошти, не зв’язуються з постачальниками послуг зв’язку і не висилають або звантажують файли. Налаштування означає, що параметри є, а не те, що було перевірено доставку, доступ до постачальника або доступ до сховища.
        statuses:
          incomplete: Незавершене налаштування
        settings_needed: Параметри для перегляду
        unknown_provider: Вибір невідомого постачальника
        provider_statuses:
          not_configured: Відсутній ключ API
          invalid: Некоректне вибране
        configure_providers: Відкрити параметри самообслуговування
        storage_backend: 'Вибране сховище: %{backend}'
        storage_backends:
          local: Локальний диск
          test: Перевірити диск
          amazon: Amazon S3
          cloudflare: Cloudflare R2
          generic_s3: Зберігання, сумісне з S3
          google: Сховище Google Cloud
          other: Нетиповий або нерозпізнаний сервер
        checks:
          smtp:
            title: Ел. пошта (SMTP)
            statuses:
              configured: Наявні параметри SMTP.
              not_configured: SMTP не налаштовано. Скидання паролів, запрошення та інші системні листи не можна надсилати через SMTP.
              incomplete: Деякі параметри електронної пошти відсутні або неповні. Системні листи або посилання, які вони містять, можуть не працювати.
              disabled: Доставка електронної пошти вимкнено у налаштуваннях запущеного програми пошти.
              not_checked: Цей процес використовує інший метод доставки, ніж SMTP, наприклад, перегляд розробки. Доставка SMTP не оцінюється.
            guidance: SMTP неможливо налаштувати у інтерфейсі адміністратора. Встановіть змінні оточення електронної пошти для веб- служби і робочої служби, а потім перезапустіть обидві служби. SMTP_USERNAME і SMTP_PASSWORD можуть бути пропущені для реле без автентифікації.
            issues:
              address: SMTP_ADDRESS
              port: SMTP_PORT (число від 1 до 65535)
              sender: EMAIL_SENDER (замінити типовий sender@sure.local)
              app_domain: APP_DOMAIN (використовується у посиланнях електронної пошти)
              authentication: SMTP_USERNAME і SMTP_PASSWORD (надати або обидва, або жоден)
          securities:
            title: Ринкові ціни
            statuses:
              configured: Всі ввімкнуті постачальники ринкових цін мають налаштування.
              not_configured: Відсутні ключі API для ввімкнених постачальників ринкових цін. Автоматичний пошук фінансових цінних паперів і пошук цін недоступні за допомогою цих постачальників.
              incomplete: Принаймні в одному з увімкнених постачальників ринкових цін відсутнє налаштування або неправильний вибір. Цінні папери, призначені для цього постачальника, не можуть отримувати оновлення цін.
              disabled: Не ввімкнено постачальника ринкових цін. Автоматичний пошук фінансових цінних паперів і пошук цін недоступні.
            guidance: Виберіть постачальників і додайте потрібні ключі API у параметрах самообслуговування або налаштуйте їх у середовищі розгортання. Перевищення параметрів середовища має перевагу. Публічним провайдерам не потрібен ключ API.
          exchange_rates:
            title: Курси валют
            statuses:
              configured: Для вибраного постачальника курсів обміну є налаштування.
              not_configured: Не налаштовано користувацького постачальника курсів обміну валют. Автоматичне перетворення валюти може бути недоступним, якщо відсутній збережений курс.
            guidance: Виберіть постачальника обмінного курсу і додайте його ключ API, якщо це потрібно, у параметрах самообслуговування, або налаштуйте його у середовищі розгортання. Перевищення ключів середовища EXCHANGE_RATE_PROVIDER і постачальника API мають перевагу.
            issues:
              invalid_provider: Вибраний постачальник обмінного курсу не розпізнано. Автоматичний пошук ставки зазнає невдачі, поки не буде обрано постачальника, який підтримується.
          storage:
            title: Вивантаження і зберігання файлів
            statuses:
              configured: Наявні параметри зберігання; локальний диск не потребує реєстраційних даних хмари.
              not_configured: Вибраний сервер зберігання не має відповідних налаштувань. Вивантаження файлів може бути недоступним.
              incomplete: Відсутні або неповні потрібні параметри зберігання. Вивантаження або отримання файлів може не спрацювати.
              not_checked: Цей сервер використовує зовнішнє виявлення реєстраційних даних або нетипове налаштування. Його доступ не можна визначити лише за допомогою цих параметрів.
            guidance: Переглянути параметри розгортання ACTIVE_STORAGE_SERVICE і вибраного сервера. Локальний диск потребує постійного місця для зберігання, яке спільно використовується веб- службами і службами роботи. Зміна серверів не призведе до перенесення існуючих файлів; будь- які перенесення плануйте окремо.
