        similar_threshold_hint: Similarité minimale des descriptions, sans tenir compte des nombres et des codes de référence (0,5–0,99). Une valeur plus basse renseigne davantage de transactions, mais augmente le risque d'erreurs. Le bouton Appliquer du réglage automatique modifie également ce seuil.
