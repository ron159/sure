            guidance: SMTP ne peut pas être configuré dans l’interface d’administration. Définissez les variables d’environnement e-mail pour les services web et les services workers, puis redémarrez-les tous les deux. SMTP_USERNAME et SMTP_PASSWORD peuvent être omettés dans le cas d’un relais non authentifié.
