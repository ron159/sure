        similar_common_share_hint: 'Un mot ou groupe de 3 lettres présent dans plus de cette proportion des transactions sources (0,01–1), et dans au moins 50 d''entre elles, est trop courant pour les distinguer : il est donc ignoré, comme « carte » ou « paiement ». Une valeur plus élevée inclut davantage de mots. Le bouton Appliquer du réglage automatique modifie également ce seuil.'
