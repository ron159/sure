        confusion: "%{actual} → %{predicted}"
        confusions: 'Erreurs les plus courantes : %{column} à %{threshold}'
        current: Mes paramètres
        defaults: Valeurs par défaut
        description: Chaque colonne est notée sur les derniers mois %{months} en tant que nouvelles transactions, chaque mois entraînée sur l'historique précédent, puis comparée à vos catégories. Les tests ne modifient aucune catégorie de transaction et les paramètres du classificateur ne changent que lorsque vous appliquez ou réinitialisez.
        find_best: Trouver les meilleurs paramètres
