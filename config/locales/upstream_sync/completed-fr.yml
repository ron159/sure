        buttons_hint: 'Tester mes paramètres note vos paramètres. Trouver les meilleurs paramètres recherche les mois %{tuning} avant ceux affichés, de sorte que ce qu''il trouve est noté sur les mois qu''il n''a pas vus. Il juge par ROC-AUC : dans quelle mesure les scores classent les transactions de chaque catégorie au-dessus des autres, à n''importe quel seuil, en conservant un changement uniquement lorsqu''il est globalement plus élevé et dans tous les mois %{tuning} sauf un seulement. Il sélectionne d''abord les entrées (chaque combinaison du jeton du commerçant, du montant et du compte ; puis évalue le commerçant et le compte séparément ; puis le nom du commerçant et les notes sous forme de mots), puis essaie une modification à la fois des autres paramètres, et enfin à la notation. Les valeurs par défaut sont celles du classificateur d''origine, avec votre choix de catégories ; La réinitialisation aux valeurs par défaut y bascule et les teste.'
