      matcher:
        lock_similar_merchants: Verrouillez les marchands que le matcher définit
        lock_similar_merchants_hint: Arrête les règles, AI et synchronise leur modification, sauf si vous cliquez sur Appliquer sur une règle. Ses propres verrous ne comptent pas comme confirmés (réglage du Merchant Matcher).
