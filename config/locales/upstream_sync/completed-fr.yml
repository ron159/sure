            statuses:
              configured: Le fournisseur de taux de change sélectionné est configuré.
              not_configured: Aucun fournisseur de taux de change utilisable n’est configuré. La conversion automatique de devises pourrait ne pas être disponible en l’absence d’un taux enregistré.
            guidance: Choisissez un fournisseur de taux de change et ajoutez sa clé API si nécessaire dans les paramètres d’hébergement personnalisé, ou configurez-le dans l’environnement de déploiement. Les paramètres de remplacement liés aux clés EXCHANGE_RATE_PROVIDER et API du fournisseur ont la priorité.
            issues:
