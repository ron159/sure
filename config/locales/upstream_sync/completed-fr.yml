              disabled: Aucun fournisseur de prix de marché n’est activé. Les recherches automatiques de titres financiers ainsi que les recherches de prix ne sont pas disponibles.
            guidance: Choisissez des fournisseurs et ajoutez les clés API nécessaires dans les paramètres d’hébergement personnel, ou configurez-les dans l’environnement de déploiement. Les paramètres définis dans l’environnement ont la priorité. Les fournisseurs publics n’ont pas besoin d’une clé API.
          exchange_rates:
