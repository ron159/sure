        rule_hint: La règle de correspondance des marchands, activée et désactivée dans Règles. Dans votre commande de règles, une transaction sans commerçant obtient celle que ses quasi-doublons, comme "NETFLIX.COM 8812" et "Netflix com", ont tous. Les transferts sont laissés de côté.
