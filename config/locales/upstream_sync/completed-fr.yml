  admin:
    system_health:
      optional_services:
        title: Services optionnels
        description: Intégrations d’opérateurs optionnels. Les services non configurés ont un caractère informatif. Ces vérifications ne font qu’examiner les paramètres ; elles ne testent pas la connectivité, n’envoient pas d’événements de test, et ne modifient pas le consentement aux analyses. Développez un service pour voir ses détails de configuration.
        missing_settings: 'Paramètres manquants : %{settings}'
        statuses:
          incomplete: Configuration incomplète
          disabled: Désactivé dans ce processus
        notes:
          environment_disabled: L’intégration chargée est désactivée pour cet environnement Rails.
          explicitly_disabled: SKYLIGHT_ENABLED désactive explicitement l’instrumentation.
          self_hosted_checkout_disabled: Le paiement de la souscription et le portail de facturation sont désactivés en mode auto-hébergé. Les webhooks Stripe peuvent encore être configurés ; les IDs de prix de paiement ne sont pas requis ici.
          browser_analytics_disabled: Les analyses du navigateur sont désactivées pour cet environnement. Cela ne désactive pas le client serveur configuré séparément.
          shared_feedback_configured: Le feedback auto-hébergé dispose d’un projet distinct inclus dans l’installation et est activé via sa configuration. Il n’exige pas d’opérateur POSTHOG_KEY. Aucune vérification n’est effectuée concernant la désactivation dans le navigateur ou la disponibilité de SDK.
          shared_feedback_disabled: Le projet distinct de feedback auto-hébergé est désactivé en raison de la configuration relative au feedback ou à l’environnement. Cela n’empêche pas l’activation des fonctionnalités d’analyse gérées par l’opérateur.
          production_only: Cette intégration n’est utilisée que en environnement de production, conformément à la configuration actuelle de l’application.
        services:
          langfuse:
            title: Langfuse
            description: Rapports optionnels de suivi et d’évaluation via AI. Aucune trace ni demande d’évaluation n’est envoyée grâce à cette fonctionnalité.
            guidance: Définissez simultanément LANGFUSE_PUBLIC_KEY et LANGFUSE_SECRET_KEY. LANGFUSE_HOST est optionnel. Redémarrez les services concernés après avoir modifié ces paramètres.
          sentry:
            title: Sentry
            description: Rapports optionnels relatifs aux erreurs et aux performances. L’initialiseur actuel n’active la génération de rapports qu’en environnement de production.
            guidance: Définissez SENTRY_DSN et redémarrezz les services concernés. Cette action vérifie la configuration SDK chargée sans enregistrer d’erreur ni envoyer d’événement.
          skylight:
            title: Skylight
            description: Instrumentation optionnelle pour l’performance de l’application. La présence de cette configuration ne prouve pas que l’agent est en cours d’exécution ou qu’il génère des rapports.
            guidance: Définissez SKYLIGHT_AUTHENTICATION et assurez-vous que Skylight est chargé dans l’environnement Rails prévu. La valeur SKYLIGHT_ENABLED=false désactive l’instrumentation ; ce paramètre seul ne charge pas le module nécessaire. Redémarrez après les modifications.
          stripe:
            title: Stripe
            description: Webhooks optionnels pour la facturation et les paiements des abonnements. Cette vérification ne crée pas de client Stripe, ne valide pas les identifiants, et ne soumet pas de demandes de paiement.
            guidance: Définissez STRIPE_SECRET_KEY et STRIPE_WEBHOOK_SECRET ensemble. Le processus de paiement des abonnements gérés nécessite également STRIPE_MONTHLY_PRICE_ID et STRIPE_ANNUAL_PRICE_ID.
          posthog:
            title: PostHog
            description: Analytiques optionnelles gérées par l’opérateur, utilisant la configuration chargée au démarrage. Le fait que cette configuration soit définie ne signifie pas pour autant que l’utilisateur a donné son consentement pour ces analyses.
            guidance: Définissez POSTHOG_KEY ainsi qu’un POSTHOG_HOST non vide, ou laissez le paramètre hôte non défini pour utiliser la valeur par défaut. Les analyses du navigateur exigent un environnement de production ou POSTHOG_DEVELOPMENT_ENABLED en mode développement. POSTHOG_FEEDBACK_ENABLED gère les retours d’information auto-hébergés distincts, et non les analyses destinées aux opérateurs.
          logtail:
            title: Logtail
            description: Redirection optionnelle des journaux en environnement de production. Lorsqu’elle n’est pas configurée, l’application continue d’enregistrer les données dans la sortie standard.
            guidance: Définissez à la fois LOGTAIL_API_KEY et LOGTAIL_INGESTING_HOST, puis redémarrez les services concernés. Aucun journal de test n’est généré par cette vérification.
      configuration:
