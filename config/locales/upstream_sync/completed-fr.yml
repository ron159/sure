              not_configured: Le backend de stockage sélectionné ne dispose d’aucune configuration correspondante. Le téléchargement de fichiers pourrait ne pas être disponible.
              incomplete: Les paramètres de stockage requis manquent ou sont incomplets. Le téléchargement ou la récupération de fichiers ne fonctionnera pas.
              not_checked: Ce backend utilise la découverte de identifiants externes ou une configuration personnalisée. Son accès ne peut pas être déterminé uniquement à partir de ces paramètres.
            guidance: Vérifiez ACTIVE_STORAGE_SERVICE ainsi que les paramètres de déploiement du backend sélectionné. Le disque local nécessite un stockage persistant partagé par les services web et les services workers. Changer de backend ne migre pas les fichiers existants ; planifiez toute migration séparément.
