          shared_feedback_disabled: Het aparte self-hosted feedbackproject is uitgeschakeld door de instellingen voor feedback of de omgeving. Dit schakelt de door de operator beheerde analyses niet uit.
          production_only: Deze integratie wordt alleen in productieomgevingen gebruikt, afhankelijk van de huidige configuratie van de applicatie.
        services:
          langfuse:
            title: Langfuse
            description: Optioneel traceren en rapporteren van AI. Door deze controle worden geen sporen of evaluatieverzoeken verstuurd.
            guidance: Stel LANGFUSE_PUBLIC_KEY en LANGFUSE_SECRET_KEY samen in. LANGFUSE_HOST is optioneel. Zet de betreffende diensten opnieuw op na het wijzigen van deze instellingen.
          sentry:
            title: Sentry
            description: Optioneel rapporteren van fouten en prestaties. De huidige inicialisator maakt rapporteren alleen mogelijk in productieomgevingen.
            guidance: Stel SENTRY_DSN in en zet de betreffende diensten opnieuw op. Hiermee wordt de geladen SDK-configuratie gecontroleerd, zonder dat er een fout wordt geregistreerd of een event wordt verstuurd.
          skylight:
            title: Skylight
            description: Optioneel instrumenteren van de applicatieprestaties. Het feit dat de configuratie aanwezig is, garandeert niet dat de agent draait of rapporteert.
            guidance: Stel SKYLIGHT_AUTHENTICATION in en zorg ervoor dat Skylight wordt geladen in de gewenste Rails-omgeving. Als SKYLIGHT_ENABLED=false wordt de instrumentatie uitgeschakeld; alleen dit vlaggetje zorgt er niet voor dat de benodigde component wordt geladen. Zet de applicatie opnieuw op na de wijzigingen.
          stripe:
            title: Stripe
            description: Optionele facturatie voor abonnementen en webhooks voor betalingen. Deze controle creëert geen Stripe-client, valideert geen credentials, noch stelt er betalingsverzoeken op.
            guidance: Stel zowel STRIPE_SECRET_KEY als STRIPE_WEBHOOK_SECRET tegelijkertijd in. Voor het beheerde afrekenproces voor abonnementen zijn ook STRIPE_MONTHLY_PRICE_ID en STRIPE_ANNUAL_PRICE_ID nodig.
          posthog:
            title: PostHog
            description: Optionele analytics die eigendom zijn van de provider, waarbij gebruik wordt gemaakt van de bij het opstarten geladen configuratie. Het feit dat deze is geconfigureerd betekent niet dat de gebruiker heeft ingestemd met het gebruik van analytics.
            guidance: Stel POSTHOG_KEY in en geef een niet-lege waarde op voor POSTHOG_HOST, of laat de host ongeconfigureerd om de standaardinstellingen te gebruiken. Browseranalytics vereisen een productieomgeving of POSTHOG_DEVELOPMENT_ENABLED in de ontwikkelomgeving. POSTHOG_FEEDBACK_ENABLED beheert afzonderlijke, zelf gehoste feedbackfuncties, en niet de analytics van de provider.
          logtail:
            title: Logtail
            description: Optioneel doorsturen van logs naar de productieomgeving. Wanneer dit niet is geconfigureerd, blijft de applicatie logs genereren naar de standaarduitvoer.
