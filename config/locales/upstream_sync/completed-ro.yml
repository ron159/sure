            description: Raportarea opțională a erorilor și a performanței. Inițializatorul curent permite raportarea numai în producție.
            guidance: Setați SENTRY_DSN și reporniți serviciile afectate. Aceasta verifică configurația SDK încărcată fără a captura o eroare sau a trimite un eveniment.
          skylight:
            title: Skylight
            description: Instrumentație opțională pentru performanța aplicației. Prezența configurației nu confirmă faptul că agentul rulează sau raportează.
            guidance: Setați SKYLIGHT_AUTHENTICATION și asigurați-vă că Skylight este încărcat în mediul Rails dorit. SKYLIGHT_ENABLED=false dezactivează instrumentarea; steagul singur nu încarcă gem-ul. Reporniți după modificări.
