            description: Redirecționarea opțională a jurnalului de producție. Când este neconfigurat, aplicația continuă să se înregistreze la ieșirea standard.
            guidance: Setați LOGTAIL_API_KEY și LOGTAIL_INGESTING_HOST împreună și reporniți serviciile afectate. Nici un jurnal de testare nu este emis de această verificare.
