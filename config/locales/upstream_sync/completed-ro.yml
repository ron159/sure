            title: Stripe
            description: Facturare opțională a abonamentelor și webhooks de plată. Această verificare nu creează un client Stripe, nu validează acreditările și nu face solicitări de plată.
            guidance: Setaţi STRIPE_SECRET_KEY şi STRIPE_WEBHOOK_SECRET împreună. Pentru finalizarea achiziției abonamentului gestionat sunt necesare și STRIPE_MONTHLY_PRICE_ID și STRIPE_ANNUAL_PRICE_ID.
          posthog:
            title: PostHog
            description: Analiză opțională deținută de operator, utilizând configurația încărcată la pornire. Configurat nu înseamnă că un utilizator și-a dat consimțământul pentru analiza datelor.
            guidance: Setați POSTHOG_KEY și un POSTHOG_HOST nonblank, sau lăsați gazda nesetată pentru a utiliza valoarea implicită. Analiza browserului necesită producție sau POSTHOG_DEVELOPMENT_ENABLED în curs de dezvoltare. POSTHOG_FEEDBACK_ENABLED controlează feedback-ul separat auto-găzduit, nu analiza operatorului.
          logtail:
