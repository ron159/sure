              not_checked: Aquest procés usa un mètode de lliurament diferent del SMTP, com ara una vista prèvia de desenvolupament. La entrega de SMTP no està avaluada.
            guidance: No es pot configurar SMTP a la interfície d'administració. Establiu les variables d'entorn de correu tant per al servei web com per al servei de treball, i després reinicieu- los. SMTP_USERNAME i SMTP_PASSWORD es poden ometre per a un relé no autenticat.
            issues:
              address: SMTP_ADDRESS
              port: SMTP_PORT (un número des de 1 fins a 65535)
              sender: EMAIL_SENDER (substitueix el sender@sure.local per omissió)
              app_domain: APP_DOMAIN (usat en enllaços de correu)
