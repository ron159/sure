          securities:
            title: Preus de mercat
            statuses:
              configured: Tots els proveïdors de preus de mercat habilitats tenen configuració.
              not_configured: Als proveïdors de preus de mercat activats els falten les claus API. No es poden cercar valors ni consultar preus automàticament mitjançant aquests proveïdors.
              incomplete: Almenys un proveïdor de preus de mercat activat té una configuració incompleta o una selecció no vàlida. És possible que els valors assignats a aquest proveïdor no rebin actualitzacions de preu.
              disabled: No hi ha cap proveïdor de preus de mercat activat. No es poden cercar valors ni consultar preus automàticament.
            guidance: Escolliu proveïdors i afegiu les claus API requerides en els arranjaments d'autoallotjament, o configureu- les en l'entorn de desplegament. Les sobreescriptures de l'entorn tenen prioritat. Els proveïdors públics no necessiten una clau API.
          exchange_rates:
