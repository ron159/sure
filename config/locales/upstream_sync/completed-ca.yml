        merchant_field_hint: Compta per identitat, de manera que un comerciant amb canvi de nom conserva el seu historial.
        merchant_name_words: Inclou el nom del comerciant com a paraules
        merchant_name_words_hint: Llegiu com la descripció, com ho fa l'original, de manera que noms similars comparteixen proves. Se superposa amb el testimoni de sota.
      run:
        success: Bayes està categoritzant transaccions no categoritzades. Això pot trigar uns quants moments.
      scoring:
        complement: Utilitzeu complement ingenu Bayes
        complement_hint: Puntua cada categoria segons com de poc s'ajusta la transacció a les altres. Això gestiona millor les categories de mides molt diferents. Si es desactiva, s'utilitza el model multinomial original.
        prior: Inclou la freqüència amb què s'utilitza cada categoria
        prior_hint: Afavoreix les categories que utilitzeu més sovint. Si es desactiva, tracta totes les categories igual, com el model original.
        separate_fields: Puntueu el comerciant i el compte a part de les paraules
        separate_fields_hint: Cadascun té la seva pròpia distribució, de manera que una descripció llarga no els supera. Necessita el comerciant o el compte inclòs; la quantitat sempre es puntua per si sola.
        smoothing: Suavització
        smoothing_hint: S'ha afegit a cada recompte perquè una paraula no vista no descarti una categoria (0,001–10). 1 és l'original; menys confia en el que s'ha vist més.
