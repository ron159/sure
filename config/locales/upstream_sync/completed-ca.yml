        rule_hint: La regla del classificador de categories, activada i desactivada amb ella a Regles. Classifica les transaccions no categoritzades en l'ordre de la regla, després de cada sincronització; el que no està segur es deixa per a una regla de categorització automàtica.
        threshold: Llindar
        threshold_hint: La puntuació mínima requerida per Bayes per classificar una transacció (0.05–0.99). Els llindars més baixos classifiquen més transaccions però també cometen més errors.
      clear_locks:
        success: Els panys de Bayes s'estan esborrant. Això pot trigar uns quants moments.
      evaluation:
        apply_best: Apliqueu aquests paràmetres
        best: Millor trobat
        best_changes: 'Millor trobat, canviat del vostre:'
        best_no_changes: No hi ha res millor que la vostra configuració.
        buttons_hint: 'Prova la meva configuració puntua la teva configuració. Troba la millor configuració cerca el %{tuning} mesos abans que els que es mostren, de manera que el que troba es puntua en mesos que no ha vist. Es jutja per ROC-AUC: com les puntuacions classifiquen les transaccions de cada categoria per sobre de la resta, en qualsevol llindar, mantenint un canvi només quan sigui més alt en general i en tots els mesos d''aquests %{tuning}, excepte en un. Primer tria les entrades (cada combinació del testimoni del comerciant, l''import i el compte; després, separa el comerciant i el compte; després el nom del comerciant i les notes com a paraules), després prova un canvi a la vegada a la resta de paràmetres i, per últim, a la puntuació. Els valors per defecte són els del classificador original, amb les categories que escolliu; Restableix als valors predeterminats els canvia i els prova.'
        categories_heading: Classificador de categoria
        change: "%{setting}: %{value}"
        confusion: "%{actual} → %{predicted}"
        confusions: 'Errors més comuns: %{column} a %{threshold}'
        current: La meva configuració
        defaults: Per defecte
        description: Cada columna es puntua en els darrers mesos %{months} com a transaccions noves, cada mes s'entrena amb l'historial anterior i després es compara amb les vostres categories. La prova no canvia cap categoria de transacció i la configuració del classificador només canvia quan apliqueu o restableixis.
        find_best: Trobeu la millor configuració
        matcher_confusions: 'Errors comercials més comuns: %{column} a %{similarity}'
        matcher_description: 'Comerciants que el comparador omple els mateixos mesos %{months}: %{count} transaccions amb un comerciant, cadascuna comparada amb l''historial anterior al seu mes amb el seu comerciant ocult; dret és el comerciant que té. Es puntua cada tall i nombre de comerciants; El millor trobat és el que té la millor cel·la pel cost d''un error, que estableix l''aplicació. Les proves no inclouen comerciants.'
        merchants_heading: Coincidència de comerciants
        no_confusions: No hi ha errors en aquest llindar.
        no_matcher_confusions: No hi ha errors de comerciant en aquesta similitud.
        no_uncategorized: No hi ha res sense classificar en aquest llindar.
        no_unfilled: No queda res sense comerciant en aquesta semblança.
        none: Encara no s'ha provat.
