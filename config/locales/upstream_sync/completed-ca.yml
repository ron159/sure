              not_checked: Aquest dorsal usa el descobriment de credencials extern o una configuració personalitzada. El seu accés no es pot determinar només a partir d'aquests paràmetres.
            guidance: Revisa ACTIVE_STORAGE_SERVICE i els paràmetres de desplegament del dorsal seleccionat. El disc local necessita emmagatzematge persistents compartit pels serveis web i de treball. Canviar els dorsals no migra els fitxers existents; planifiqueu qualsevol migració per separat.
