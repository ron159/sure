    system_health:
      optional_services:
        title: Serveis opcionals
        description: Integracions opcionals d'operadors. Els serveis no configurats són informatius. Aquestes comprovacions només inspeccionen l'arranjament; no comproven la connectivitat, no envien esdeveniments de prova, ni canvien el consentiment analític. Expandeix un servei per als detalls de configuració.
        missing_settings: 'Arranjaments que falten: %{settings}'
        statuses:
          incomplete: Configuració incompleta
          disabled: Desactivat en aquest procés
        notes:
          environment_disabled: La integració carregada està deshabilitada per a aquest entorn Rails.
          explicitly_disabled: SKYLIGHT_ENABLED desactiva explícitament la instrumentació.
          self_hosted_checkout_disabled: La sortida de la subscripció i el portal de facturació estan deshabilitats en mode autoallotjat. Els webhooks Stripe encara es poden configurar; aquí no es requereixen ID de preus de pagament.
          browser_analytics_disabled: L'anàlisi del navegador està deshabilitat per a aquest entorn. Això no deshabilita el client del servidor configurat per separat.
          shared_feedback_configured: Els comentaris auto- allotjats tenen un projecte agrupat separat i està habilitat per la seva configuració. No requereix un operador POSTHOG_KEY. No s' han comprovat la desactivació del navegador i la disponibilitat de SDK.
          shared_feedback_disabled: El projecte de retroalimentació autoallotjat separat està deshabilitat per la seva configuració de retroalimentació o entorn. Això no deshabilita l'anàlisi propietat de l'operador.
          production_only: Aquesta integració només s' usa en producció per la configuració actual de l'aplicació.
        services:
          langfuse:
            title: Langfuse
            description: Opcional AI seguiment i avaluació d'informes. Aquesta comprovació no envia cap traça o petició d'avaluació.
            guidance: Posa LANGFUSE_PUBLIC_KEY i LANGFUSE_SECRET_KEY junts. LANGFUSE_HOST és opcional. Reinicia els serveis afectats després de canviar aquests valors.
          sentry:
            title: Sentry
            description: Informe opcional d'errors i rendiment. L'inicialitzador actual habilita l'informe només en producció.
            guidance: Estableix SENTRY_DSN i reinicia els serveis afectats. Això comprova la configuració SDK carregada sense capturar un error o enviar un esdeveniment.
          skylight:
            title: Skylight
            description: Instrumentació opcional del rendiment de l'aplicació. La presència de configuració no confirma que l'agent s' estigui executant o informant.
            guidance: Estableix SKYLIGHT_AUTHENTICATION i assegura' t que Skylight està carregat en l'entorn Rails desitjat. SKYLIGHT_ENABLED=false deshabilita la instrumentació; la bandera sola no carrega la gemma. Reinicia després dels canvis.
          stripe:
            title: Stripe
            description: Facturació de subscripció opcional i webhooks de pagament. Aquesta comprovació no crea un client Stripe, valida les credencials, o fa peticions de pagament.
            guidance: Posa STRIPE_SECRET_KEY i STRIPE_WEBHOOK_SECRET junts. La gestió de la subscripció també necessita STRIPE_MONTHLY_PRICE_ID i STRIPE_ANNUAL_PRICE_ID.
          posthog:
            title: PostHog
            description: Anàlisi opcional propietat de l'operador, usant la configuració carregada en arrencar. Configurat no vol dir que un usuari hagi consentit l'anàlisi.
            guidance: Estableix POSTHOG_KEY i un POSTHOG_HOST no buit, o deixa la màquina sense establir per usar l'omissió. L'anàlisi del navegador requereix producció o POSTHOG_DEVELOPMENT_ENABLED en desenvolupament. POSTHOG_FEEDBACK_ENABLED controla la retroalimentació auto-allotjada separada, no l'anàlisi de l'operador.
          logtail:
            title: Logtail
            description: Reenviament opcional del registre de producció. Quan no està configurat, l'aplicació continua registrant a la sortida estàndard.
            guidance: Estableix LOGTAIL_API_KEY i LOGTAIL_INGESTING_HOST junts i reengega els serveis afectats. Aquesta comprovació no emet cap registre de prova.
