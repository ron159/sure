        threshold: Llindar
        trying: S'està provant %{changes}...
        uncategorized: 'No categoritzat més comú: %{column} a %{threshold}'
        unfilled: 'No emplenat més habitual: %{column} a %{similarity}'
        weight: Un error costa
        weight_hint: 'Tria el que estableix Apply: les cel·les en negreta, on les respostes correctes menys aquestes per error són més altes. Llindar de millor trobat per a categories; el tall, la similitud i el nombre de comerciants per al matcher.'
        weight_option:
          one: 1 resposta correcta
          other: "%{count} respostes correctes"
      matcher:
        lock_similar_merchants: Bloqueja els comerciants que estableix el comparador
        lock_similar_merchants_hint: Atura les regles, AI i sincronitza canviant-les, tret que feu clic a Aplica a una regla. Els seus propis panys no compten com a confirmats (ajustament de la combinació de comerciants).
        rule: Empleneu els comerciants que falten dels gairebé duplicats
        rule_hint: La regla de comparació de comerciants, activada i desactivada amb ella a Regles. A la vostra comanda de regla, una transacció sense comerciant obté la que tenen gairebé els seus duplicats, com ara "NETFLIX.COM 8812" i "Netflix com". Les transferències queden fora.
        similar_threshold: Similitud
        similar_threshold_hint: Semblança més baixa de les descripcions, ignorant els números i els codis de referència (0,5–0,99). La part inferior s'omple més, amb més errors. L'aplicació de l'ajust automàtic també ho estableix.
      matcher_tuning:
        similar_common_share: Tall
        similar_common_share_hint: Una paraula o una peça de 3 lletres en més d'aquesta part de les transaccions de les quals copia (0,01–1) i en almenys 50 d'elles, és massa habitual per diferenciar-les, com ara "targeta" o "pagament", de manera que s'ignora. Més alt en compta més. L'aplicació de l'ajust automàtic també ho estableix.
        similar_min_neighbours: Els comerciants accepten
        similar_min_neighbours_hint: Quants gairebé duplicats ha de tenir el comerciant, sense que cap en tingui un altre. 1 copia una única transacció, errors també.
        similar_min_neighbours_option:
          one: 1 comerciant
          other: "%{count} comerciants"
        similar_skip_self: No copieu dels propis comerciants de l'aparellador fins que no es confirmi o tants dies d'antiguitat
        similar_skip_self_hint: Confirmat significa que l'heu canviat o bloquejat. No es difon una còpia incorrecta; un que es deixa sol aquest temps compta com a acceptat.
      merchant:
