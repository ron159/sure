              not_configured: No s' ha configurat cap proveïdor de tipus de canvi utilitzable. La conversió automàtica de moneda pot no estar disponible quan falti una taxa desada.
            guidance: Escolliu un proveïdor de tipus de canvi i afegiu la seva clau API si es requereix en la configuració d'autoallotjament, o configureu- la en l'entorn de desplegament. Les sobreescriptures de l'entorn de la clau EXCHANGE_RATE_PROVIDER i del proveïdor API tenen prioritat.
