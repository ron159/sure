              not_configured: Nenhum fornecedor de taxa de câmbio utilizável foi configurado. A conversão automática de moeda pode não estar disponível quando uma taxa armazenada estiver faltando.
            guidance: Escolha um fornecedor de taxa de câmbio e adicione sua chave API, se necessário, nas configurações de autohospedagem, ou configure-o no ambiente de implantação. As configurações do ambiente para as chaves EXCHANGE_RATE_PROVIDER e API têm prioridade.
