          securities:
            title: Preços de mercado
            statuses:
              configured: Todos os fornecedores de preços de mercado habilitados possuem configuração.
              not_configured: Os fornecedores de preços de mercado habilitados estão sem as chaves API. Buscas automáticas por títulos financeiros e consultas de preços não estão disponíveis por meio desses fornecedores.
