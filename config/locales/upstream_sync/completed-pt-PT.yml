              disabled: Nenhum fornecedor de preço de mercado está ativado. As buscas automáticas por títulos financeiros e as consultas de preços não estão disponíveis.
            guidance: Escolha os fornecedores e adicione as chaves API necessárias nas configurações de autohospedagem, ou configure-os no ambiente de implantação. As configurações do ambiente têm prioridade. Os fornecedores públicos não precisam da chave API.
          exchange_rates:
