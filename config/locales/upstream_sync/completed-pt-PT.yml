        description: Integrações opcionais com operadoras. Os serviços não configurados têm apenas finalidade informativa. Essas verificações analisam apenas as configurações; elas não testam a conectividade, nem enviam eventos de teste, nem alteram o consentimento para análises. Expanda um serviço para ver os detalhes de configuração.
