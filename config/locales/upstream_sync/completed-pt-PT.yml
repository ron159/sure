            statuses:
              configured: As configurações de armazenamento estão presentes; o disco local não requer credenciais de nuvem.
              not_configured: O backend de armazenamento selecionado não possui configuração correspondente. O carregamento de arquivos pode não estar disponível.
              incomplete: As configurações de armazenamento necessárias estão faltando ou incompletas. O carregamento ou a recuperação de arquivos podem não funcionar.
              not_checked: Este backend utiliza descoberta de credenciais externas ou uma configuração personalizada. Seu acesso não pode ser determinado apenas com base nessas configurações.
            guidance: Revise o ACTIVE_STORAGE_SERVICE e as configurações de implantação do backend selecionado. O disco local necessita de armazenamento persistente compartilhado pelos serviços web e de trabalho. A alteração de backends não migra arquivos existentes; planeje qualquer migração separadamente.
