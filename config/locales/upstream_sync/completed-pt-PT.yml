          disabled: Desativado neste processo
        notes:
          environment_disabled: A integração carregada está desativada para este ambiente Rails.
          explicitly_disabled: SKYLIGHT_ENABLED desativa explicitamente a instrumentação.
          self_hosted_checkout_disabled: O checkout de assinaturas e o portal de faturamento são desativados no modo auto-hospedado. Os webhooks Stripe ainda podem ser configurados; aqui, os IDs de preço do checkout não são necessários.
          browser_analytics_disabled: As análises do navegador são desativadas para este ambiente. Isso não desativa o cliente do servidor configurado separadamente.
          shared_feedback_configured: O feedback auto-hospedado possui um projeto embutido separado e é ativado por meio de sua configuração. Ele não requer um operador POSTHOG_KEY. A opção de exclusão do navegador e a disponibilidade do SDK não são verificadas.
          shared_feedback_disabled: O projeto separado de feedback auto-hospedado é desativado por meio de sua configuração de feedback ou de ambiente. Isso não desativa as análises de propriedade do operador.
          production_only: Esta integração é utilizada apenas em produção, de acordo com a configuração atual do aplicativo.
        services:
          langfuse:
            title: Langfuse
            description: Relatórios opcionais de rastreamento e avaliação AI. Nenhuma solicitação de rastreamento ou avaliação é enviada por esta verificação.
            guidance: Defina LANGFUSE_PUBLIC_KEY e LANGFUSE_SECRET_KEY juntos. LANGFUSE_HOST é opcional. Reinicie os serviços afetados após alterar essas configurações.
          sentry:
            title: Sentry
            description: Relatórios opcionais de erros e desempenho. O inicializador atual permite a geração de relatórios apenas em ambiente de produção.
            guidance: Defina SENTRY_DSN e reinicie os serviços afetados. Isso verifica a configuração SDK carregada sem registrar erro ou enviar evento algum.
          skylight:
            title: Skylight
            description: Instrumentação opcional de desempenho do aplicativo. A simples presença da configuração não garante que o agente esteja em execução ou gerando relatórios.
            guidance: Defina SKYLIGHT_AUTHENTICATION e certifique-se de que Skylight esteja carregado no ambiente Rails desejado. SKYLIGHT_ENABLED=false desativa a instrumentação; sozinho, esse parâmetro não carrega o módulo necessário. Reinicie após as alterações.
          stripe:
            title: Stripe
            description: Webhooks opcionais para cobrança de assinaturas e pagamentos. Esta verificação não cria um cliente Stripe, nem valida credenciais, nem envia solicitações de pagamento.
            guidance: Defina STRIPE_SECRET_KEY e STRIPE_WEBHOOK_SECRET juntos. O processo de finalização de compra de assinaturas gerenciadas também requer STRIPE_MONTHLY_PRICE_ID e STRIPE_ANNUAL_PRICE_ID.
          posthog:
            title: PostHog
            description: Análises opcionais de propriedade do operador, utilizando a configuração carregada na inicialização. O fato de estar configurado não significa que o usuário concordou com as análises.
            guidance: Defina POSTHOG_KEY e um valor não vazio para POSTHOG_HOST, ou deixe o campo do host sem valor para usar o padrão. As análises do navegador exigem o ambiente de produção ou POSTHOG_DEVELOPMENT_ENABLED no ambiente de desenvolvimento. POSTHOG_FEEDBACK_ENABLED controla o feedback autogerido separado, e não as análises do operador.
          logtail:
            title: Logtail
            description: Encaminhamento opcional de logs para o ambiente de produção. Quando não está configurado, o aplicativo continua registrando os logs na saída padrão.
            guidance: Defina LOGTAIL_API_KEY e LOGTAIL_INGESTING_HOST juntos e reinicie os serviços afetados. Nenhuma mensagem de log de teste é gerada por esta verificação.
      configuration:
        description: Configuração visível para este processo da web. Essas verificações não enviam e-mails, entram em contato com provedores, nem fazem upload ou download de arquivos. O fato de estar configurado significa que as definições existem, e não que a entrega, o acesso aos provedores ou o acesso ao armazenamento foram verificados.
