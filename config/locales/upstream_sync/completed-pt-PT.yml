        description: O classificador de categorias Bayes aprende com as suas transações já categorizadas e as classifica automaticamente antes de qualquer processador AI. As alterações nessas configurações entram em vigor na próxima execução de classificação; as transações já categorizadas mantêm suas categorias.
        matcher: Correlacionador
        matcher_description: Preenche os comerciantes faltantes a partir de duplicatas próximas, por meio da regra do correlacionador de comerciantes (após cada sincronização) e durante as execuções. Isso altera os comerciantes armazenados.
        matcher_tuning: Ajuste do correlacionador de comerciantes
        merchant: Ajuste do comerciante
        run: Executar
        scoring: Classificação
        title: Classificador
        training: Treinamento
        words: Ajuste da transação
      training:
        max_training_transactions: Transações de treinamento
        max_training_transactions_hint: 'Quantas das transações mais recentes utilizar (100–20,000): as categorizadas, das quais o classificador aprende, e aquelas com um comerciante, das quais o comparador copia.'
      words:
        bigrams: Incluir pares de palavras
        bigrams_hint: Palavras vizinhas também são consideradas juntas, como em "pagamento com cartão".
        binary: Excluir palavras repetidas
        binary_hint: Cada palavra é contada uma única vez por transação.
        drop_codes: Excluir códigos de referência
        drop_codes_hint: Palavras que misturam letras com 2 ou mais dígitos, como 2k4l19.
        drop_numbers: Excluir números
        drop_numbers_hint: Armazenar números, datas e valores na descrição.
        include_notes: Incluir notas
        include_notes_hint: Lê as notas, bem como o nome.
        keep_single_chars: Incluir palavras de um único caractere
        keep_single_chars_hint: Letras e dígitos que restam após a divisão, como o "s" de mcdonald's.
        spread_filter: Excluir palavras utilizadas por todas as categorias da mesma forma
        spread_filter_hint: Eles não fornecem informações sobre a categoria. O número indica o quanto o uso de uma categoria deve ser maior que a média geral.
        word_split: As palavras são compostas por
        word_split_ascii: a–z e 0–9
        word_split_hint: Todos os outros caracteres separam as palavras. As letras de qualquer escrita mantêm palavras como Geschäft ou Кофейня intactas; as letras ligadas por um único símbolo interno também permanecem uma palavra, como mcdonald's, s/o e m&s (um símbolo em qualquer das extremidades, como em *netflix, continua a ser removido).
        word_split_symbols: Letras, dígitos e símbolos internos
        word_split_unicode: Letras e dígitos, de qualquer escrita
