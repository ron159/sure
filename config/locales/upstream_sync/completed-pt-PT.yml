        rule_hint: A regra do classificador de categorias, ativada ou desativada nas Regras. Ela classifica as transações não categorizadas de acordo com a ordem das regras, após cada sincronização; o que ela não consegue classificar é deixado para uma regra de classificação automática.
        threshold: Limiar
        threshold_hint: A pontuação mínima necessária para que Bayes classifique uma transação (0.05–0.99). Limiares mais baixos classificam mais transações, mas também causam mais erros.
      clear_locks:
        success: Os bloqueios de Bayes estão sendo removidos. Isso pode levar alguns instantes.
      evaluation:
        apply_best: Aplicar estas definições
        best: Melhor encontrado
        best_changes: 'Melhor encontrado, diferente das suas:'
        best_no_changes: Nada obteve uma pontuação melhor do que as suas definições.
        buttons_hint: 'Testar as minhas definições avalia as suas definições. A opção ''Encontrar as melhores definições'' analisa os dados dos %{tuning} meses anteriores aos exibidos, de modo que o que for encontrado seja avaliado com base nos meses que não foram analisados. A avaliação é feita com base no ROC-AUC: quão bem as pontuações classificam as transações de cada categoria em relação às demais, em qualquer limiar, mantendo uma alteração apenas quando ela for superior de forma geral e em todos, exceto um, dos meses do %{tuning}. Primeiro, são selecionados os parâmetros de entrada (toda combinação de token do comerciante, valor e conta bancária; depois, é feita a pontuação separadamente para o comerciante e para a conta bancária; em seguida, o nome do comerciante e as anotações são analisados como palavras), em seguida, são feitas alterações uma de cada vez nos demais parâmetros, e por último, na própria pontuação. Os valores padrão são os do classificador original, com as categorias escolhidas por você; a opção ''Reiniciar para padrões'' altera para esses valores padrão e os testa.'
        categories_heading: Classificador de categorias
        change: "%{setting}: %{value}"
        confusion: "%{actual} → %{predicted}"
        confusions: 'Erros mais comuns: %{column} em %{threshold}'
        current: Minhas configurações
        defaults: Padrões
        description: Cada coluna é avaliada com base nos últimos %{months} meses de transações novas, sendo cada mês treinado com base no histórico anterior, e depois comparado com suas categorias. Os testes não alteram a categoria de nenhuma transação, e as configurações do classificador só mudam quando você as aplica ou redefine.
        find_best: Encontrar as melhores configurações
        matcher_confusions: 'Erros mais comuns de comerciante: %{column} em %{similarity}'
        matcher_description: 'Comerciantes que o comparador seleciona nos mesmos meses %{months}: transações %{count} com um comerciante, cada uma comparada com o histórico anterior ao seu mês, sendo o comerciante correspondente ocultado; à direita está indicado o comerciante associado. Cada corte e número de comerciantes são avaliados; o melhor resultado é aquele com a menor taxa de erro, conforme definido pelo Aplicar. Nos testes, nenhum comerciante é selecionado.'
        merchants_heading: Comparador de comerciantes
        no_confusions: Nenhum erro neste limiar.
        no_matcher_confusions: Nenhum erro de identificação de comerciante nesta semelhança.
        no_uncategorized: Nada ficou sem classificação neste limiar.
        no_unfilled: Nada ficou sem um comerciante associado nesta semelhança.
        none: Ainda não foi testado.
        ran_at: Foi avaliado com %{time} há algum tempo em transações %{count} (%{months}).
        reset: Reiniciar para valores padrão
        reset_confirm: Reiniciar todas as configurações do classificador para seus valores padrão e testá-las?
        right_wrong: Cada célula está correta / incorreta.
        run: Testar minhas configurações
        running: Testando… esta seção será atualizada quando estiver concluído.
        short_history: Não há histórico suficiente para ajustar o classificador de categorias por enquanto. São necessários aproximadamente %{months} meses de transações categorizadas; por isso, o Aplicativo deixa suas configurações inalteradas por agora.
        similarity: Semelhança
        stale: As configurações foram alteradas desde este teste.
        threshold: Limiar
        trying: Tentando %{changes}…
        uncategorized: 'Mais comum não categorizado: %{column} em %{threshold}'
        unfilled: 'Mais comum sem preenchimento: %{column} em %{similarity}'
        weight: Um erro tem um custo
        weight_hint: 'Seleciona o que o Apply define: as células em negrito, onde a diferença entre as respostas corretas e esse valor por erro é a maior. É o limiar ideal para as categorias; o ponto de corte, a semelhança e o número de comerciantes para o mecanismo de correspondência.'
        weight_option:
          one: Resposta correta 1
          other: Respostas corretas %{count}
      matcher:
        lock_similar_merchants: Bloqueia os comerciantes definidos pelo ajustador
        lock_similar_merchants_hint: Interrompe as regras, AI, e sincroniza as alterações nelas, a menos que você clique em Aplicar em uma regra. Os bloqueios próprios não são considerados confirmados (Ajuste do ajustador de comerciantes).
        rule: Preenche os comerciantes faltantes a partir de duplicatas próximas
        rule_hint: A regra do ajustador de comerciantes, ativada ou desativada nas Regras. Na ordem das suas regras, uma transação sem comerciante recebe o do seu correspondente em duplicatas próximas, como "NETFLIX.COM 8812" e "Netflix com", que todos possuem. As transferências são excluídas.
        similar_threshold: Semelhança
        similar_threshold_hint: Menor semelhança entre as descrições, ignorando números e códigos de referência (0.5–0.99). Quanto menor o valor, mais informações são preenchidas, mas também mais erros podem ocorrer. O Aplicar do ajuste automático também define esse valor.
      matcher_tuning:
        similar_common_share: Data de corte
        similar_common_share_hint: Uma palavra ou sequência de 3 letras presente em mais do que esta proporção das transações de origem (0,01–1) e em pelo menos 50 delas é demasiado comum para as distinguir, como «cartão» ou «pagamento», pelo que é ignorada. Um valor mais alto inclui mais palavras. O botão Aplicar do ajuste automático também define este valor.
        similar_min_neighbours: Comerciantes que concordam
        similar_min_neighbours_hint: Quantos duplicatas quase idênticas devem pertencer ao mesmo comerciante, sem que nenhum deles tenha outro. O 1 também copia uma única transação, o que é um erro.
        similar_min_neighbours_option:
          one: Comerciante 1
          other: Comerciantes %{count}
        similar_skip_self: Não copie os comerciantes do próprio matcher até que seja confirmado ou até que tenham passado estes dias
        similar_skip_self_hint: Confirmado significa que você o modificou ou bloqueou. Uma cópia incorreta não é disseminada; uma deixada sem alterações por tanto tempo é considerada aceita.
      merchant:
        merchant_field: Inclua o comerciante como um único token, quando definido
        merchant_field_hint: A contagem é feita por identidade, portanto um comerciante com nome alterado mantém seu histórico.
        merchant_name_words: Inclua o nome do comerciante como palavras
        merchant_name_words_hint: Leia da mesma forma que a descrição original, de modo que nomes semelhantes compartilhem evidências. Há sobreposição com o token abaixo.
      run:
        success: Bayes está classificando transações não categorizadas. Isso pode levar alguns instantes.
      scoring:
        complement: Use o complemento simples Bayes
        complement_hint: Avalia cada categoria de acordo com o quão mal a transação se encaixa nas demais, o que lida melhor com categorias de tamanhos muito diferentes. O modo 'Desativado' utiliza o método multinomial original.
        prior: Inclui a frequência com que cada categoria é utilizada
        prior_hint: Dá preferência às categorias que você utiliza com mais frequência. O modo 'Desativado' trata todas as categorias da mesma forma, como no método original.
        separate_fields: Avalia o comerciante e a conta separadamente das palavras
        separate_fields_hint: Cada um recebe sua própria classificação, portanto uma descrição longa não tem maior peso sobre eles. É necessário incluir o comerciante ou a conta bancária; o valor é sempre avaliado separadamente.
        smoothing: Suavização
        smoothing_hint: É adicionado a cada contagem para que uma palavra não vista não exclua uma categoria (0.001–10). 1 corresponde ao valor original; o método com menor confiança leva em conta o que foi visto com mais frequência.
      show:
        add_rule_body: Não há regra %{name} nas suas regras atuais, portanto não há nada para ativar. Deseja adicioná-la no início das suas regras?
        add_rule_confirm: Adicionar regra
        add_rule_title: Deseja adicionar a regra %{name}?
        account: Ajuste da conta bancária
        amount: Ajuste do valor
        auto_tune: Ajuste automático
        category_training: Ajuste do classificador de categorias
        clear_locks: Remover bloqueios Bayes
        clear_locks_confirm_body: Desbloqueia as categorias Bayes bloqueadas e os comerciantes bloqueados pelo mecanismo de correspondência que ainda estão conforme definidos, para que as regras e AI possam alterá-los novamente. As categorias e os comerciantes permanecem.
