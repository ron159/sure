          smtp:
            title: E-mail (SMTP)
            statuses:
              configured: As configurações do SMTP estão presentes.
              not_configured: O SMTP não está configurado. Redefinições de senha, convites e outros e-mails do sistema não podem ser enviados por meio do SMTP.
              incomplete: Algumas configurações de e-mail estão faltando ou incompletas. Os e-mails do sistema ou os links neles contidos podem não funcionar.
              disabled: A entrega de e-mails está desativada na configuração do agente de e-mail em execução.
              not_checked: Este processo utiliza um método de entrega diferente de SMTP, como uma versão de pré-visualização para desenvolvedores. A entrega por SMTP não foi avaliada.
            guidance: SMTP não pode ser configurado na interface de administração. Defina as variáveis de ambiente de e-mail para tanto os serviços web quanto os de trabalho e, em seguida, reinicie ambos. SMTP_USERNAME e SMTP_PASSWORD podem ser omitidos em um relay não autenticado.
