        skip_self_labels_hint: Confirmado significa que você o alterou ou bloqueou. Uma tentativa incorreta não é exibida novamente para reforçar o erro; um que permanece assim por tanto tempo é considerado aceito.
      add_rule:
        success: A regra %{name} foi adicionada no topo das suas regras.
      classifier:
        lock_results: Bloqueie as categorias definidas pelo classificador
