          environment_disabled: Загруженная интеграция отключена для данной среды Rails.
          explicitly_disabled: SKYLIGHT_ENABLED прямо запрещает использование инструментов анализа.
          self_hosted_checkout_disabled: В режиме самостоятельной развертки отключены процесс оплаты подписки и портал для формирования счётов. При этом всё ещё можно настроить вебхуки Stripe; здесь не требуется указание идентификаторов цен на оплату.
          browser_analytics_disabled: В данной среде отключена аналитика браузера. Это не влияет на отдельно настроенный серверный клиент.
          shared_feedback_configured: Функция самостоятельной обратной связи имеет отдельный пакет проектов и включается в работу в зависимости от настроек. Для её работы не требуется оператор POSTHOG_KEY. Не проверяется возможность отказа от использования браузера и наличие SDK.
          shared_feedback_disabled: Отдельный проект самостоятельной обратной связи отключается в зависимости от настроек обратной связи или среды. Это не влияет на аналитику, принадлежащую оператору.
          production_only: Эта интеграция используется исключительно в производственной среде в соответствии с текущими настройками приложения.
        services:
          langfuse:
            title: Langfuse
            description: Необязательная отчётность о трассировке и оценке с использованием AI. При этом проверке не отправляются никакие данные о трассировке или запросы на оценку.
            guidance: Установите значения LANGFUSE_PUBLIC_KEY и LANGFUSE_SECRET_KEY одновременно. Значение LANGFUSE_HOST является необязательным. После изменения этих настроек перезапустите затронутые сервисы.
          sentry:
            title: Sentry
            description: Необязательная отчётность об ошибках и производительности. Текущий инициализатор включает отчётность только в режиме производства.
            guidance: Установите значение SENTRY_DSN и перезапустите затронутые сервисы. Эта операция проверяет загруженную конфигурацию SDK, не фиксируя ошибок и не отправляя события.
          skylight:
            title: Skylight
            description: Необязательный инструментальный мониторинг производительности приложения. Наличие конфигурации не гарантирует, что агент работает или отправляет отчёты.
            guidance: Установите значение SKYLIGHT_AUTHENTICATION и убедитесь, что Skylight загружен в предусмотренной среде Rails. Значение SKYLIGHT_ENABLED=false отключает инструментальный мониторинг; само это значение не загружает соответствующий компонент. Перезапустите после изменений.
          stripe:
            title: Stripe
            description: Необязательные вебхуки для выставления счётов и осуществления платежей за подписку. Эта проверка не создаёт клиента Stripe, не проверяет учётные данные и не отправляет запросы на оплату.
            guidance: Установите STRIPE_SECRET_KEY и STRIPE_WEBHOOK_SECRET вместе. Для процесса оплаты подписки с автоматическим управлением также требуются STRIPE_MONTHLY_PRICE_ID и STRIPE_ANNUAL_PRICE_ID.
          posthog:
            title: PostHog
            description: Необязательная аналитика, принадлежащая оператору, которая использует конфигурацию, загруженную при запуске. Наличие такой настройки не означает, что пользователь дал согласие на сбор аналитических данных.
            guidance: Установите POSTHOG_KEY и ненулевое значение POSTHOG_HOST, либо оставьте параметр хоста неустановленным для использования значений по умолчанию. Для аналитики браузера требуется режим производства или POSTHOG_DEVELOPMENT_ENABLED в режиме разработки. POSTHOG_FEEDBACK_ENABLED контролирует отдельную самостоятельную систему сбора отзывов, а не аналитику оператора.
          logtail:
            title: Logtail
            description: Необязательная пересылка логов в режиме производства. При отсутствии настройки приложение продолжает записывать логи в стандартный вывод.
