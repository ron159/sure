        complement_hint: Оценивает каждую категорию по тому, насколько плохо транзакция соответствует другим категориям. Это помогает при сильно различающихся размерах категорий. В выключенном состоянии используется исходная мультиномиальная модель.
        prior: Укажите, как часто используется каждая категория
        prior_hint: Отдаёт предпочтение категориям, которые вы используете чаще всего. В выключенном состоянии все категории рассматриваются одинаково, как в исходной модели.
