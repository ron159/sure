        buttons_hint: 'Проверьте мои настройки, чтобы оценить ваши настройки. Поиск лучших настроек выполняет поиск по %{tuning} за несколько месяцев до показанных, поэтому то, что он находит, оценивается по месяцам, которых он не видел. Он оценивает ROC-AUC: насколько хорошо оценки ранжируют транзакции каждой категории выше остальных, при любом пороговом значении, сохраняя изменение только тогда, когда оно в целом выше и только за один из этих %{tuning} месяцев. Сначала он выбирает входные данные (каждую комбинацию токена продавца, суммы и счета; затем разделяет оценку продавца и учетной записи; затем имя продавца и примечания в виде слов), затем пытается по одному изменить другие настройки и, наконец, выполняет подсчет очков. По умолчанию используются исходные классификаторы с выбором категорий; Сброс к настройкам по умолчанию переключает их и тестирует.'
