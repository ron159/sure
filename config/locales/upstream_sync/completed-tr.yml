            guidance: Kendi sunucunuzda ayarlamalar yaparak sağlayıcıları seçin ve gerekli API anahtarlarını ekleyin veya dağıtım ortamında bunları yapılandırın. Ortam ayarları önceliklidir. Kamu sağlayıcılarının API anahtarına ihtiyacı yoktur.
