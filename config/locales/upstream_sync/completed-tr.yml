          browser_analytics_disabled: Bu ortam için tarayıcı analitiği devre dışı bırakılmıştır. Bu durum, ayrı olarak yapılandırılmış sunucu istemcisini etkilemez.
          shared_feedback_configured: Kendi sunucunuzda barındırılan geri bildirim özelliği, ayrı bir projeyi kapsar ve kendi yapılandırması aracılığıyla etkinleştirilir. Bu özellik için POSTHOG_KEY adlı bir operatöre ihtiyaç duyulmaz. Tarayıcıdan çıkış işlemleri ve SDK'nin kullanılabilirliği kontrol edilmez.
          shared_feedback_disabled: Ayrı olarak kendi sunucunuzda barındırılan geri bildirim projesi, ilgili geri bildirim veya ortam ayarları nedeniyle devre dışı bırakılmıştır. Bu durum, operatör tarafından yönetilen analitik özellikleri etkilemez.
          production_only: Bu entegrasyon, uygulamanın mevcut yapılandırması gereği yalnızca üretim ortamında kullanılır.
        services:
          langfuse:
            title: Langfuse
            description: İsteğe bağlı olarak AI ile izleme ve değerlendirme raporlaması yapılabilir. Bu kontrol işlemi sırasında herhangi bir iz veya değerlendirme isteği gönderilmez.
            guidance: LANGFUSE_PUBLIC_KEY ve LANGFUSE_SECRET_KEY ayarlarını birlikte belirleyin. LANGFUSE_HOST isteğe bağlıdır. Bu ayarları değiştirdikten sonra ilgili hizmetleri yeniden başlatın.
          sentry:
            title: Sentry
            description: İsteğe bağlı hata ve performans raporlaması. Mevcut başlatıcı yalnızca üretim ortamında raporlama yapılmasını sağlar.
            guidance: SENTRY_DSN değerini ayarlayın ve ilgili hizmetleri yeniden başlatın. Bu işlem, herhangi bir hata oluşturmadan veya olay göndermeden yüklenen SDK yapılandırmasını kontrol eder.
          skylight:
            title: Skylight
            description: İsteğe bağlı uygulama performansı izleme özelliği. Yapılandırmanın mevcut olması, aracın çalıştığını veya raporlama yaptığını garanti etmez.
            guidance: SKYLIGHT_AUTHENTICATION değerini ayarlayın ve Skylight’in hedeflenen Rails ortamında yüklü olduğundan emin olun. SKYLIGHT_ENABLED=false değeri izleme özelliğini devre dışı bırakır; bu ayar tek başına ilgili bileşeni yüklemeye yetmez. Değişikliklerden sonra uygulamayı yeniden başlatın.
          stripe:
            title: Stripe
            description: İsteğe bağlı abonelik faturalandırma ve ödeme webhook’leri. Bu kontrol işlemi, Stripe istemcisi oluşturmaz, kimlik bilgilerini doğrulamaz veya ödeme isteklerinde bulunmaz.
            guidance: STRIPE_SECRET_KEY ve STRIPE_WEBHOOK_SECRET değerlerini birlikte ayarlayın. Yönetilen abonelik ödeme işlemleri için ayrıca STRIPE_MONTHLY_PRICE_ID ve STRIPE_ANNUAL_PRICE_ID değerlerine de ihtiyaç vardır.
          posthog:
            title: PostHog
            description: Başlangıçta yüklenen yapılandırmayı kullanan, isteğe bağlı olarak operatör tarafından yönetilen analizler. Yapılandırmanın ayarlanmış olması, kullanıcının bu analizlere onay verdiği anlamına gelmez.
            guidance: POSTHOG_KEY ve boş olmayan bir POSTHOG_HOST değeri ayarlayın; veya varsayılan değerleri kullanmak için bu ayarları boş bırakın. Tarayıcı tabanlı analizler için üretim ortamı veya geliştirme ortamında POSTHOG_DEVELOPMENT_ENABLED gereklidir. POSTHOG_FEEDBACK_ENABLED, operatör analizleri yerine ayrı bir şekilde kendiniz barındırdığınız geri bildirimleri kontrol eder.
          logtail:
            title: Logtail
            description: İsteğe bağlı olarak üretim ortamındaki günlük kayıtlarının başka bir yere gönderilmesi. Bu özellik yapılandırılmamış olduğunda, uygulama standart çıktıya kayıt yapmaya devam eder.
            guidance: LOGTAIL_API_KEY ve LOGTAIL_INGESTING_HOST değerlerini birlikte ayarlayın ve ilgili hizmetleri yeniden başlatın. Bu kontrol işlemi sırasında herhangi bir test günlüğü üretilmez.
