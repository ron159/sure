      evaluation:
        apply_best: Áp dụng các thiết lập này
        best: Kết quả tốt nhất
        best_changes: 'Đã tìm thấy phương án tốt nhất, khác với phương án của bạn:'
        best_no_changes: Không có phương án nào đạt điểm cao hơn so với cài đặt của bạn.
        buttons_hint: 'Việc kiểm tra cài đặt của tôi sẽ đánh giá cài đặt của bạn. Tính năng Tìm phương án tốt nhất sẽ tìm kiếm trong %{tuning} tháng trước những phương án được hiển thị, vì vậy những gì nó tìm thấy sẽ được đánh giá dựa trên các tháng mà nó chưa xem xét. Nó đánh giá dựa trên ROC-AUC: mức độ mà các giao dịch thuộc từng nhóm được xếp hạng cao hơn so với các giao dịch khác ở mọi ngưỡng, chỉ giữ lại sự thay đổi khi tổng thể và ở tất cả các tháng ngoại trừ một tháng trong số %{tuning} cho thấy kết quả tốt hơn. Đầu tiên nó chọn các yếu tố đầu vào (mọi tổ hợp của mã đơn vị bán hàng, số tiền và tài khoản ngân hàng; sau đó đánh giá riêng từng đơn vị bán hàng và tài khoản ngân hàng; tiếp theo là tên đơn vị bán hàng và các ghi chú dưới dạng từ ngữ), sau đó thử từng thay đổi một đối với các cài đặt khác, và cuối cùng là phương pháp đánh giá. Các giá trị mặc định là của bộ phân loại ban đầu, kèm theo các nhóm mà bạn đã chọn; tùy chọn Đặt lại thành mặc định sẽ chuyển sang các giá trị này và kiểm tra chúng.'
        categories_heading: Bộ phân loại theo nhóm
