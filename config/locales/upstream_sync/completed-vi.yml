        weight: Một sai sót sẽ gây ra chi phí.
        weight_hint: 'Chọn những mục mà tùy chọn ‘Áp dụng’ đặt ra: những ô được in đậm, nơi mà số tiền cần khấu trừ cho mỗi sai sót là cao nhất. Đây chính là ngưỡng tối ưu được xác định cho các danh mục; ngưỡng cắt, mức độ tương đồng và số lượng đơn vị bán hàng dùng để vận hành bộ so khớp.'
