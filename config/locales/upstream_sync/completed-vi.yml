        skip_self_labels_hint: Việc xác nhận có nghĩa là bạn đã thay đổi hoặc khóa thông tin đó. Những suy đoán sai sẽ không được phản hồi lại để củng cố; những suy đoán bị bỏ mặc trong thời gian dài sẽ được coi là đã được chấp nhận.
