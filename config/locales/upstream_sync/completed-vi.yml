      classifier:
        lock_results: Hãy khóa các thể loại mà bộ phân loại thiết lập.
        lock_results_hint: Nó sẽ ngăn các quy tắc thay đổi các lựa chọn của Bayes, trừ khi bạn nhấn nút Áp dụng cho một quy tắc nào đó. AI sẽ không bao giờ thay đổi các lựa chọn của Bayes, dù chúng có bị khóa hay không.
        rule: Hãy phân loại bằng bộ phân loại.
        rule_hint: Quy tắc phân loại danh mục, có thể bật/tắt trong mục Quy tắc. Quy tắc này sẽ phân loại các giao dịch chưa được phân loại theo thứ tự các quy tắc của bạn sau mỗi lần đồng bộ hóa; những giao dịch mà nó không chắc chắn sẽ được chuyển sang quy tắc tự động phân loại.
        threshold: Ngưỡng
        threshold_hint: Điểm số tối thiểu cần thiết để Bayes phân loại một giao dịch (0.05–0.99). Các ngưỡng thấp hơn sẽ giúp phân loại nhiều giao dịch hơn nhưng cũng dễ gây ra nhiều sai sót hơn.
      clear_locks:
