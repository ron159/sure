      matcher:
        lock_similar_merchants: Khóa lại các đơn vị bán hàng mà bộ so khớp đã chọn
        lock_similar_merchants_hint: Ngăn chặn các quy tắc, AI và việc cập nhật chúng, trừ khi bạn nhấn ‘Áp dụng’ cho một quy tắc nào đó. Những khóa tự động không được coi là đã được xác nhận (Điều chỉnh bộ so khớp đơn vị bán hàng).
        rule: Nhập lại các đơn vị bán hàng bị thiếu từ những mục gần giống nhau
        rule_hint: Quy tắc ghép đơn vị bán hàng, có thể bật/tắt trong mục Quy tắc. Trong thứ tự các quy tắc của bạn, một giao dịch không ghi rõ đơn vị bán hàng sẽ được gán theo đơn vị bán hàng của những mục gần giống nó, chẳng hạn như "NETFLIX.COM 8812" và "Netflix com" đều có ghi rõ. Các giao dịch chuyển khoản giữa các tài khoản ngân hàng sẽ bị loại trừ.
        similar_threshold: Mức độ tương đồng
        similar_threshold_hint: Mức độ tương đồng thấp nhất giữa các mô tả, bỏ qua các con số và mã tham chiếu (0.5–0.99). Các giá trị ở mức thấp hơn sẽ được điền vào nhiều hơn, kèm theo nhiều sai sót hơn. Tùy chọn ‘Apply’ của tính năng Auto-tune cũng đang thiết lập giá trị này ở mức quá cao.
      matcher_tuning:
        similar_common_share: Thời hạn cuối
        similar_common_share_hint: Một từ hoặc chuỗi 3 chữ cái xuất hiện trong hơn tỷ lệ giao dịch nguồn này (0,01–1) và trong ít nhất 50 giao dịch là quá phổ biến để phân biệt chúng, chẳng hạn «thẻ» hoặc «thanh toán», nên sẽ bị bỏ qua. Giá trị cao hơn tính đến nhiều từ hơn. Nút Áp dụng của tính năng tự điều chỉnh cũng đặt giá trị này.
        similar_min_neighbours: Các đơn vị bán hàng đồng ý
        similar_min_neighbours_hint: Cần bao nhiêu giao dịch gần giống nhau thuộc về cùng một đơn vị bán hàng, và không được có giao dịch nào thuộc về đơn vị bán hàng khác. 1 sao chép cả một giao dịch, điều này cũng được coi là sai lầm.
        similar_min_neighbours_option:
          one: Đơn vị bán hàng của 1
          other: Các đơn vị bán hàng của %{count}
        similar_skip_self: Đừng sao chép từ các đơn vị bán hàng của chính bộ phận so khớp cho đến khi được xác nhận hoặc đã qua bấy nhiêu ngày
        similar_skip_self_hint: Việc xác nhận có nghĩa là bạn đã thay đổi hoặc khóa giao dịch đó. Những bản sao sai sẽ không được phát tán; một bản sao còn sót lại trong thời gian dài đó sẽ được coi là đã được chấp nhận.
      merchant:
        merchant_field: Khi được thiết lập, hãy đưa tên của đơn vị bán hàng thành một đơn vị duy nhất.
        merchant_field_hint: Việc đếm được thực hiện dựa trên đặc điểm nhận diện, vì vậy ngay cả khi tên đơn vị bán hàng được đổi, lịch sử giao dịch vẫn được giữ nguyên.
        merchant_name_words: Hãy hiển thị tên của đơn vị bán hàng dưới dạng các từ riêng lẻ.
        merchant_name_words_hint: Cách hiển thị tương tự như mô tả gốc, do đó các tên tương tự sẽ được chia sẻ chứng cứ. Nội dung này sẽ trùng lặp với phần mô tả ở mục bên dưới.
      run:
        success: Bayes đang phân loại các giao dịch chưa được phân loại. Quá trình này có thể mất vài phút.
      scoring:
        complement: Hãy sử dụng phiên bản đơn giản hóa của Bayes.
        complement_hint: Chấm điểm mỗi danh mục dựa trên mức độ giao dịch không phù hợp với các danh mục còn lại, giúp xử lý tốt hơn khi kích thước các danh mục rất khác nhau. Khi tắt, hệ thống sử dụng mô hình đa thức ban đầu.
        prior: Bao gồm tần suất sử dụng mỗi danh mục.
        prior_hint: Ưu tiên các danh mục bạn sử dụng thường xuyên nhất. Khi tắt, mọi danh mục được xử lý như nhau, giống mô hình ban đầu.
        separate_fields: Đánh giá riêng đơn vị bán hàng và tài khoản ngân hàng, tách biệt khỏi các từ khóa.
        separate_fields_hint: Mỗi yếu tố đều có phân bố riêng, vì vậy một mô tả dài không ảnh hưởng quá nhiều đến chúng. Cần phải bao gồm đơn vị bán hàng hoặc tài khoản ngân hàng; số tiền luôn được đánh giá riêng.
        smoothing: Làm mịn dữ liệu.
        smoothing_hint: Được thêm vào mọi phép đếm nhằm đảm bảo rằng một từ chưa từng xuất hiện sẽ không khiến một danh mục bị loại bỏ (0.001–10). 1 là phiên bản gốc; các quy tắc có mức độ tin cậy thấp hơn sẽ ưu tiên những gì đã từng xuất hiện nhiều hơn.
      show:
        add_rule_body: Trong các quy tắc của bạn không có quy tắc %{name} nào, vì vậy không có gì cần bật lên. Bạn có muốn thêm nó lên đầu danh sách các quy tắc không?
        add_rule_confirm: Thêm quy tắc
        add_rule_title: Có nên thêm quy tắc %{name} không?
