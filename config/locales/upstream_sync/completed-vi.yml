        matcher_description: 'Các đơn vị bán hàng mà bộ phân loại xác định trong cùng %{months} tháng: Các giao dịch %{count} với một đơn vị bán hàng, mỗi giao dịch sẽ được so sánh với dữ liệu lịch sử trước tháng của nó với tên đơn vị bán hàng bị ẩn; bên phải là đơn vị bán hàng mà nó thuộc về. Mọi ngưỡng và số lượng đơn vị bán hàng đều được đánh giá; giải pháp tốt nhất là giải pháp có giá trị tế bào tốt nhất về chi phí sai sót, và chính giải pháp đó sẽ được áp dụng. Việc thử nghiệm sẽ không xác định bất kỳ đơn vị bán hàng nào.'
