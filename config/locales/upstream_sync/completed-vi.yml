  admin:
    system_health:
      optional_services:
        title: Các dịch vụ tùy chọn
        description: Các tích hợp với nhà cung cấp dịch vụ tùy chọn. Các dịch vụ chưa được cấu hình chỉ mang tính chất thông tin. Những kiểm tra này chỉ xem xét các thiết lập; chúng không kiểm tra khả năng kết nối, gửi các sự kiện thử nghiệm, hay thay đổi sự đồng ý về phân tích dữ liệu. Hãy mở rộng một dịch vụ để xem chi tiết cấu hình.
        missing_settings: 'Thiếu thiết lập: %{settings}'
        statuses:
          incomplete: Cấu hình chưa hoàn chỉnh
          disabled: Đã bị vô hiệu hóa trong quy trình này
        notes:
          environment_disabled: Việc tích hợp đã tải lên đang bị vô hiệu hóa đối với môi trường Rails này.
          explicitly_disabled: SKYLIGHT_ENABLED đã vô hiệu hóa các công cụ giám sát một cách rõ ràng.
          self_hosted_checkout_disabled: Chức năng thanh toán gói dịch vụ và cổng quản lý hóa đơn đều bị vô hiệu hóa trong chế độ tự chủ. Các webhook của Stripe vẫn có thể được cấu hình; ở đây không yêu cầu mã ID giá thanh toán.
          browser_analytics_disabled: Các tính năng phân tích trình duyệt đang bị vô hiệu hóa đối với môi trường này. Điều này không ảnh hưởng đến phần mềm khách hàng trên máy chủ được cấu hình riêng biệt.
          shared_feedback_configured: Chức năng phản hồi tự chủ có một dự án riêng được tích hợp sẵn và được kích hoạt thông qua cài đặt của nó. Chức năng này không yêu cầu bất kỳ nhân viên POSTHOG_KEY nào. Các tùy chọn từ chối trên trình duyệt và mức độ sẵn có của SDK sẽ không được kiểm tra.
          shared_feedback_disabled: Dự án phản hồi tự chủ riêng biệt đang bị vô hiệu hóa do cài đặt phản hồi hoặc môi trường tương ứng. Điều này không ảnh hưởng đến các tính năng phân tích do nhà cung cấp quản lý.
          production_only: Sự tích hợp này chỉ được sử dụng trong môi trường sản xuất với cấu hình hiện tại của ứng dụng.
        services:
          langfuse:
            title: Langfuse
            description: Báo cáo theo dõi và đánh giá AI mang tính tùy chọn. Kiểm tra này sẽ không gửi bất kỳ dữ liệu theo dõi hay yêu cầu đánh giá nào.
            guidance: Hãy thiết lập cùng lúc LANGFUSE_PUBLIC_KEY và LANGFUSE_SECRET_KEY. LANGFUSE_HOST là tùy chọn. Hãy khởi động lại các dịch vụ bị ảnh hưởng sau khi thay đổi các thiết lập này.
          sentry:
            title: Sentry
            description: Báo cáo về lỗi và hiệu suất mang tính tùy chọn. Bộ khởi tạo hiện tại chỉ cho phép tạo báo cáo trong môi trường sản xuất.
            guidance: Hãy thiết lập SENTRY_DSN và khởi động lại các dịch vụ bị ảnh hưởng. Thao tác này sẽ kiểm tra cấu hình SDK đã được tải mà không ghi nhận lỗi hay gửi bất kỳ sự kiện nào.
          skylight:
            title: Skylight
            description: Công cụ đo lường hiệu suất ứng dụng mang tính tùy chọn. Việc có mặt các thiết lập không đảm bảo rằng tiện ích liên quan đang chạy hoặc đang tạo báo cáo.
            guidance: Hãy thiết lập SKYLIGHT_AUTHENTICATION và đảm bảo rằng Skylight được tải vào môi trường Rails mong muốn. Việc đặt giá trị SKYLIGHT_ENABLED thành false sẽ vô hiệu hóa các chức năng giám sát; riêng biến cờ này thôi thì không thể tải thêm thư viện cần thiết được. Hãy khởi động lại ứng dụng sau khi thực hiện các thay đổi.
          stripe:
            title: Stripe
            description: Các webhook cho việc thanh toán và tính phí gói đăng ký theo yêu cầu. Việc kiểm tra này sẽ không tạo ra client Stripe, xác thực thông tin tài khoản, hay gửi yêu cầu thanh toán nào cả.
            guidance: Hãy thiết lập cùng lúc cả STRIPE_SECRET_KEY và STRIPE_WEBHOOK_SECRET. Quy trình thanh toán cho gói đăng ký được quản lý cũng cần có sự hiện diện của STRIPE_MONTHLY_PRICE_ID và STRIPE_ANNUAL_PRICE_ID.
          posthog:
            title: PostHog
            description: Các chức năng phân tích do bên vận hành cung cấp, mang tính tùy chọn, và sử dụng cấu hình được tải vào lúc khởi động ứng dụng. Việc cấu hình xong không có nghĩa là người dùng đã đồng ý cho việc thu thập dữ liệu phân tích.
            guidance: Hãy thiết lập POSTHOG_KEY cùng với một giá trị không trống cho POSTHOG_HOST, hoặc để giá trị của host không được thiết lập để sử dụng giá trị mặc định. Các chức năng phân tích trong trình duyệt yêu cầu môi trường production hoặc POSTHOG_DEVELOPMENT_ENABLED trong môi trường phát triển. POSTHOG_FEEDBACK_ENABLED điều khiển chức năng phản hồi tự vận hành riêng biệt, chứ không phải các chức năng phân tích do bên vận hành cung cấp.
          logtail:
            title: Logtail
            description: Chức năng chuyển tiếp nhật ký hoạt động sang môi trường production, mang tính tùy chọn. Khi chức năng này chưa được cấu hình, ứng dụng vẫn tiếp tục ghi nhật ký vào đầu ra tiêu chuẩn.
            guidance: Hãy thiết lập cùng lúc LOGTAIL_API_KEY và LOGTAIL_INGESTING_HOST, sau đó khởi động lại các dịch vụ bị ảnh hưởng. Kiểm tra này sẽ không tạo ra bất kỳ bản ghi nhật ký nào.
      configuration:
        description: Cấu hình hiển thị cho tiến trình web này. Các kiểm tra này không gửi email, liên hệ với các nhà cung cấp, hay tải lên hoặc tải xuống tệp tin. Việc cấu hình được thực hiện có nghĩa là các thiết lập tồn tại, chứ không có nghĩa là việc truyền dữ liệu, quyền truy cập vào nhà cung cấp, hoặc quyền truy cập lưu trữ đã được xác minh.
        statuses:
          incomplete: Cấu hình chưa đầy đủ
        settings_needed: Các thiết lập cần được xem xét
        unknown_provider: Lựa chọn nhà cung cấp không được nhận diện
        provider_statuses:
          not_configured: Không tìm thấy khóa API
          invalid: Lựa chọn không hợp lệ
        configure_providers: Mở cài đặt tự chủ
        storage_backend: 'Nơi lưu trữ được chọn: %{backend}'
        storage_backends:
          local: Đĩa cục bộ
          test: Đĩa thử nghiệm
          amazon: Amazon S3
          cloudflare: Cloudflare R2
          generic_s3: Bộ lưu trữ tương thích S3
          google: Lưu trữ Google Cloud
          other: Phần mềm nền tảng tùy chỉnh hoặc chưa được nhận diện
        checks:
          smtp:
            title: Email (SMTP)
            statuses:
              configured: Các thiết lập SMTP đã được cài đặt.
              not_configured: SMTP chưa được cấu hình. Việc gửi mật khẩu mới, thư mời, và các email hệ thống khác sẽ không thể được thực hiện thông qua SMTP.
              incomplete: Một số thiết lập email bị thiếu hoặc chưa hoàn chỉnh. Các email hệ thống hoặc các liên kết trong đó có thể sẽ không hoạt động.
              disabled: Chức năng gửi email đã bị vô hiệu hóa trong cấu hình bộ phát thư hiện tại.
              not_checked: Quy trình này sử dụng phương thức gửi khác thay vì SMTP, chẳng hạn như chế độ xem thử phát triển. Việc gửi thông qua SMTP sẽ không được kiểm tra.
            guidance: Không thể cấu hình SMTP trong giao diện quản trị. Hãy thiết lập các biến môi trường email cho cả dịch vụ web và dịch vụ worker, sau đó khởi động lại cả hai. Cả SMTP_USERNAME lẫn SMTP_PASSWORD đều có thể bị bỏ qua trong trường hợp sử dụng chức năng truyền tin không yêu cầu xác thực.
            issues:
              address: SMTP_ADDRESS
              port: SMTP_PORT (là một con số nằm trong khoảng từ 1 đến 65535)
              sender: EMAIL_SENDER (thay thế cho giá trị mặc định sender@sure.local)
              app_domain: APP_DOMAIN (được sử dụng trong các liên kết email)
              authentication: SMTP_USERNAME và SMTP_PASSWORD (có thể sử dụng cả hai hoặc không sử dụng gì cả)
          securities:
            title: Giá thị trường
            statuses:
              configured: Tất cả các nhà cung cấp giá thị trường đã được kích hoạt đều có cấu hình tương ứng.
              not_configured: Các nhà cung cấp giá thị trường đã được kích hoạt thiếu các khóa API. Do đó, việc tìm kiếm tự động các chứng khoán tài chính và tra cứu giá cả thông qua các nhà cung cấp này sẽ không thể thực hiện được.
              incomplete: Có ít nhất một nhà cung cấp giá thị trường đã được kích hoạt bị thiếu cấu hình hoặc có lựa chọn không hợp lệ. Các chứng khoán được gán cho nhà cung cấp đó có thể sẽ không nhận được các cập nhật giá.
              disabled: Không có nhà cung cấp giá thị trường nào được kích hoạt. Các chức năng tìm kiếm tự động các chứng khoán tài chính và tra cứu giá sẽ không khả dụng.
            guidance: Hãy chọn các nhà cung cấp và thêm các khóa API cần thiết vào phần cấu hình tự chủ, hoặc cấu hình chúng trong môi trường triển khai. Các thiết lập trong môi trường sẽ có ưu tiên cao hơn. Các nhà cung cấp công cộng không cần phải có khóa API.
          exchange_rates:
            title: Tỷ giá hối đoái
            statuses:
              configured: Nhà cung cấp tỷ giá hối đoái đã được chọn có cấu hình phù hợp.
              not_configured: Không có nhà cung cấp tỷ giá hối đoái nào khả dụng được cấu hình. Chức năng chuyển đổi tiền tệ tự động có thể sẽ không khả dụng nếu thiếu tỷ giá đã lưu trữ.
