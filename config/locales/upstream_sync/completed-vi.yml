            guidance: Hãy xem xét ACTIVE_STORAGE_SERVICE cùng các thiết lập triển khai của phần mềm nền tảng đã chọn. Ổ đĩa cục bộ cần có không gian lưu trữ bền vững được chia sẻ giữa các dịch vụ web và dịch vụ công việc. Việc thay đổi phần mềm nền tảng sẽ không di chuyển các tập tin hiện có; hãy lên kế hoạch di chuyển riêng biệt.
