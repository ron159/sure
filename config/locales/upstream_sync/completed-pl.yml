          google: Google Cloud Przechowywanie
          other: Dostosowany lub nieznany backend
        checks:
          smtp:
            title: E-mail (SMTP)
            statuses:
              configured: Ustawienia SMTP są obecne.
              not_configured: SMTP nie jest skonfigurowany. Szyfrowanie haseł, zaproszenia oraz inne e-maile systemowe nie mogą być wysyłane przez SMTP.
              incomplete: Brakuje niektórych ustawień e-maila lub są one niekompletne. E-maile systemowe lub zawarte w nich linki mogą nie działać.
              disabled: W ustawieniach bieżącego programu do wysyłki e-maili dostawa e-maili jest wyłączona.
              not_checked: Ten proces wykorzystuje metodę dostawy inną niż SMTP, na przykład wersję wstępną przeznaczoną do rozwoju. Dostawa za pomocą SMTP nie jest oceniana.
            guidance: SMTP nie może być skonfigurowany w interfejsie administracyjnym. Ustaw zmienną środowiskową e-mail dla usług webowych oraz roboczych, a następnie zrestartuj obie. Dla bezautoryzowanego przekierowania można pominąć zarówno SMTP_USERNAME, jak i SMTP_PASSWORD.
            issues:
              address: SMTP_ADDRESS
              port: SMTP_PORT (liczba od 1 do 65535)
              sender: EMAIL_SENDER (zastąpi domyślne sender@sure.local)
              app_domain: APP_DOMAIN (używane w linkach e-mailowych)
              authentication: SMTP_USERNAME oraz SMTP_PASSWORD (można podać oba lub żaden z nich)
          securities:
            title: Ceny rynkowe
            statuses:
              configured: Wszyscy włączeni dostawcy cen rynkowych mają odpowiednią konfigurację.
              not_configured: Włączeni dostawcy cen rynkowych nie posiadają kluczy API. Automatyczne wyszukiwanie papierów wartościowych oraz sprawdzanie cen nie jest możliwe za pośrednictwem tych dostawców.
              incomplete: Przynajmniej jeden z włączonych dostawców cen rynkowych ma brakującą konfigurację lub niewłaściwy wybór. Papierom wartościowym przypisanym do tego dostawcy mogą nie trafiać aktualizacje cen.
              disabled: Żaden dostawca cen rynkowych nie jest włączony. Automatyczne wyszukiwanie papierów wartościowych oraz sprawdzanie cen nie jest dostępne.
            guidance: Wybierz dostawców i dodaj wszelkie wymagane klucze API w ustawieniach self-hosting, lub skonfiguruj je w środowisku implementacji. Ustawienia zastępujące z środowiska mają pierwszeństwo. Dostawcy publiczni nie wymagają klucza API.
          exchange_rates:
            title: Kursy walut
            statuses:
              configured: Wybrany dostawca kursów walut ma odpowiednie ustawienia.
              not_configured: Nie skonfigurowano żadnego dostępnego dostawcy kursów walut. Automatyczne przeliczanie walut może być niedostępne, jeśli nie ma zapisanego kursu.
            guidance: Wybierz dostawcę kursów walut i dodaj jego klucz API, jeśli jest to wymagane w ustawieniach self-hosting, lub skonfiguruj go w środowisku implementacji. Ustawienia zastępujące z klucza EXCHANGE_RATE_PROVIDER oraz klucza API dostawcy mają pierwszeństwo.
            issues:
              invalid_provider: Wybrany dostawca kursów walut nie został rozpoznany. Automatyczne wyszukiwanie kursów nie jest możliwe, dopóki nie zostanie wybrany obsługiwany dostawca.
          storage:
            title: Zapisywanie i przechowywanie plików
            statuses:
              configured: Dostępne są ustawienia przechowywania; dysk lokalny nie wymaga danych uwierzytelniających chmurowych.
              not_configured: Wybrany backend przechowywania nie posiada odpowiadającej mu konfiguracji. Zapisywanie plików może być niedostępne.
