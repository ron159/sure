        description: Konfiguracja widoczna dla tego procesu internetowego. Te sprawdzenia nie wysyłają e-maili, nie kontaktują się z dostawcami, ani nie przesyłają ani nie pobierają plików. Słowo "skonfigurowane" oznacza, że ustawienia są obecne, a nie że dostawa, dostęp do dostawców lub dostęp do przechowywania zostały zweryfikowane.
