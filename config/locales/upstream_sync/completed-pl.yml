          shared_feedback_disabled: Oddzielny, własny projekt opinii jest wyłączony ze względu na ustawienia opinii lub środowiska. Nie wyłącza to analiz prowadzonych przez operatora.
          production_only: Integracja ta wykorzystywana jest wyłącznie na produkcji przy aktualnej konfiguracji aplikacji.
        services:
          langfuse:
            title: Langfuse
            description: Opcjonalne raportowanie śledzenia i oceny AI. W ramach tej kontroli nie są wysyłane żadne ślady ani żądania oceny.
            guidance: Ustaw razem LANGFUSE_PUBLIC_KEY i LANGFUSE_SECRET_KEY. LANGFUSE_HOST jest opcjonalny. Po zmianie tych ustawień uruchom ponownie usługi, których to dotyczy.
          sentry:
            title: Sentry
            description: Opcjonalne raportowanie błędów i wydajności. Bieżący inicjator umożliwia raportowanie tylko w środowisku produkcyjnym.
            guidance: Ustaw SENTRY_DSN i zrestartuj odpowiednie usługi. Sprawdza to załadowaną konfigurację SDK bez przechwytywania błędu lub wysyłania zdarzenia.
          skylight:
            title: Skylight
            description: Opcjonalne instrumentarium wydajności aplikacji. Obecność konfiguracji nie potwierdza, że ​​agent działa lub raportuje.
            guidance: Ustaw SKYLIGHT_AUTHENTICATION i upewnij się, że Skylight jest załadowany w zamierzonym środowisku Rails. SKYLIGHT_ENABLED=false wyłącza oprzyrządowanie; sama flaga nie ładuje klejnotu. Uruchom ponownie po zmianach.
          stripe:
            title: Stripe
            description: Opcjonalne webhooki do rozliczeń subskrypcji i płatności. Ten czek nie tworzy klienta Stripe, nie sprawdza poświadczeń ani nie wysyła żądań płatności.
            guidance: Ustaw razem STRIPE_SECRET_KEY i STRIPE_WEBHOOK_SECRET. Zarządzana płatność za subskrypcję wymaga również STRIPE_MONTHLY_PRICE_ID i STRIPE_ANNUAL_PRICE_ID.
          posthog:
            title: PostHog
            description: Opcjonalna analiza należąca do operatora, wykorzystująca konfigurację ładowaną podczas rozruchu. Skonfigurowane nie oznacza, że ​​użytkownik wyraził zgodę na analitykę.
            guidance: Ustaw POSTHOG_KEY i niepusty POSTHOG_HOST lub pozostaw hosta nieskonfigurowanego, aby użyć wartości domyślnej. Analityka przeglądarki wymaga wersji produkcyjnej lub POSTHOG_DEVELOPMENT_ENABLED w fazie rozwoju. POSTHOG_FEEDBACK_ENABLED kontroluje oddzielne opinie hostowane przez operatora, a nie analizy operatora.
          logtail:
            title: Logtail
            description: Opcjonalne przesyłanie dziennika produkcji. Gdy jest nieskonfigurowana, aplikacja kontynuuje logowanie na standardowe wyjście.
            guidance: Ustaw razem LOGTAIL_API_KEY i LOGTAIL_INGESTING_HOST i zrestartuj odpowiednie usługi. W wyniku tej kontroli nie jest emitowany żaden dziennik testów.
